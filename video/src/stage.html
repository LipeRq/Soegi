<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Nodus Consulting SNS動画の舞台</title>
<style>
/* 書体：BIZ UDPGothic（@fontsource/biz-udpgothic、SIL OFL 1.1） */
@font-face { font-family: "BIZ UDPGothic"; src: url(../node_modules/@fontsource/biz-udpgothic/files/biz-udpgothic-japanese-400-normal.woff2); font-weight: 400; }
@font-face { font-family: "BIZ UDPGothic"; src: url(../node_modules/@fontsource/biz-udpgothic/files/biz-udpgothic-japanese-700-normal.woff2); font-weight: 700; }
@font-face { font-family: "BIZ UDPGothic"; src: url(../node_modules/@fontsource/biz-udpgothic/files/biz-udpgothic-latin-400-normal.woff2); font-weight: 400; unicode-range: U+0000-00FF, U+2000-206F, U+20AC, U+2122; }
@font-face { font-family: "BIZ UDPGothic"; src: url(../node_modules/@fontsource/biz-udpgothic/files/biz-udpgothic-latin-700-normal.woff2); font-weight: 700; unicode-range: U+0000-00FF, U+2000-206F, U+20AC, U+2122; }

/* 色は withsoegi.jp（css/site.css）に合わせる */
:root {
  --paper: #E9EEED; --surface: #FFFFFF; --ink: #1B2428; --ink-2: #44525A; --ink-3: #5A676E;
  --line: #D5DDDF; --accent: #1A6D73; --accent-soft: #DCF0F0; --leaf: #2E7652;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: var(--paper); overflow: hidden; }
body { font-family: "BIZ UDPGothic", sans-serif; color: var(--ink); font-feature-settings: "palt" 1; -webkit-font-smoothing: antialiased; }
#stage { position: relative; overflow: hidden; background: var(--paper); }
.scene { position: absolute; inset: 0; opacity: 0; }
.a { will-change: opacity, transform; }
b, .bold { font-weight: 700; }
.em { color: var(--accent); }
.big { font-weight: 700; line-height: 1.32; letter-spacing: .01em; }
.card { background: var(--surface); border-radius: 22px; box-shadow: 0 1px 2px rgba(29,35,39,.05), 0 14px 30px -14px rgba(29,35,39,.20); }
.shot { position: absolute; border-radius: 26px; overflow: hidden; background: #fff; box-shadow: 0 2px 4px rgba(29,35,39,.08), 0 22px 44px -18px rgba(29,35,39,.32); outline: 1px solid var(--line); }
.shot img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.shot img.b { opacity: 0; }
.shot .wait { position: absolute; inset: 0; display: grid; place-items: center; background: var(--line); color: var(--ink-2); font-size: 40px; font-weight: 700; text-align: center; line-height: 1.5; }
.note { position: absolute; color: var(--ink-3); font-size: 30px; line-height: 1.3; }
.wordmark { background: var(--ink); -webkit-mask: var(--wm) left center / contain no-repeat; mask: var(--wm) left center / contain no-repeat; }
.btn { display: inline-flex; align-items: center; justify-content: center; background: var(--accent); color: #fff; font-weight: 700; border-radius: 999px; }
.url { font-weight: 700; letter-spacing: .01em; }
.map path { fill: none; stroke: var(--ink); stroke-width: 6; stroke-linejoin: round; vector-effect: non-scaling-stroke; }
.map path.fill { fill: var(--accent-soft); stroke: none; }

/* ---------- 縦（1080×1920）：左揃え。上250px・下400pxと右側のボタン列（x>930, y>880）に文字を置かない ---------- */

.v .s2 h2 { position: absolute; left: 80px; top: 430px; font-size: 60px; font-weight: 700; }
.v .s2 .card { position: absolute; left: 80px; width: 850px; height: 170px; display: flex; align-items: center; gap: 30px; padding: 0 44px; font-size: 64px; font-weight: 700; }
.v .s2 .card i { width: 18px; height: 64px; border-radius: 9px; background: var(--accent); flex: none; }
.v .s2 .c1 { top: 570px; } .v .s2 .c2 { top: 780px; } .v .s2 .c3 { top: 990px; }
.v .demo .big { position: absolute; left: 80px; top: 290px; font-size: 72px; }
.v .demo .shot { left: 80px; top: 580px; width: 840px; height: 879px; }
.v .demo .note { left: 80px; top: 1474px; }
.v .s5 .step { position: absolute; left: 80px; width: 850px; height: 220px; padding: 0 44px; display: flex; align-items: center; gap: 34px; }
.v .s5 .n { width: 84px; height: 84px; border-radius: 50%; border: 4px solid var(--ink); display: grid; place-items: center; font-size: 46px; font-weight: 700; flex: none; }
.v .s5 .t { font-size: 62px; font-weight: 700; line-height: 1.25; }
.v .s5 .t small { display: block; font-size: 44px; font-weight: 400; color: var(--ink-2); margin-top: 6px; }
.v .s5 .st1 { top: 430px; outline: 5px solid var(--accent); } .v .s5 .st1 .n { border-color: var(--accent); color: var(--accent); }
.v .s5 .st2 { top: 750px; } .v .s5 .st3 { top: 1070px; }
.v .s5 .arr { position: absolute; left: 160px; width: 0; height: 0; border-left: 26px solid transparent; border-right: 26px solid transparent; border-top: 30px solid var(--ink-3); }
.v .s5 .ar1 { top: 680px; } .v .s5 .ar2 { top: 1000px; }
.v .s6 .map { position: absolute; left: 330px; top: 300px; height: 700px; }
.v .s6 .big { position: absolute; left: 80px; top: 1060px; font-size: 72px; }
.v .s6 .rep { position: absolute; left: 80px; top: 1300px; font-size: 42px; color: var(--ink-2); }
.v .s7 .lead { position: absolute; left: 80px; top: 400px; font-size: 54px; font-weight: 700; }
.v .s7 .wordmark { position: absolute; left: 80px; top: 560px; width: 780px; height: 128px; }
.v .s7 .tag { position: absolute; left: 80px; top: 740px; font-size: 50px; color: var(--ink-2); }
.v .s7 .btnwrap { position: absolute; left: 80px; top: 920px; }
.v .s7 .btn { height: 136px; padding: 0 46px; font-size: 54px; }
.v .s7 .url { position: absolute; left: 80px; top: 1130px; font-size: 104px; }
.v .s7.withlead .wordmark { top: 560px; } .v .s7.withlead .tag { top: 730px; } .v .s7.withlead .btnwrap { top: 900px; } .v .s7.withlead .url { top: 1100px; }
.v .thumb .big { position: absolute; left: 80px; top: 620px; font-size: 96px; }
.v .thumb .sub { position: absolute; left: 80px; top: 920px; font-size: 54px; font-weight: 700; color: var(--accent); }
.v .thumb .wordmark { position: absolute; left: 80px; top: 1100px; width: 560px; height: 92px; }

/* ---------- 正方形（1080×1080）：中央揃え。四方72px ---------- */
.sq #stage { width: 1080px; height: 1080px; }
.sq .scene { text-align: center; }
.sq .s1 .big { position: absolute; left: 0; right: 0; top: 380px; font-size: 100px; }
.sq .s2 h2 { position: absolute; left: 0; right: 0; top: 130px; font-size: 56px; font-weight: 700; }
.sq .s2 .card { position: absolute; left: 165px; width: 750px; height: 160px; display: flex; align-items: center; gap: 30px; padding: 0 44px; font-size: 60px; font-weight: 700; text-align: left; }
.sq .s2 .card i { width: 16px; height: 60px; border-radius: 8px; background: var(--accent); flex: none; }
.sq .s2 .c1 { top: 290px; } .sq .s2 .c2 { top: 490px; } .sq .s2 .c3 { top: 690px; }
.sq .demo .big { position: absolute; left: 0; right: 0; top: 72px; font-size: 60px; }
.sq .demo .shot { left: 228px; top: 268px; width: 624px; height: 653px; }
.sq .demo .note { left: 0; right: 0; top: 950px; font-size: 28px; }
.sq .s5 .step { position: absolute; top: 330px; width: 296px; height: 380px; padding: 40px 12px; display: flex; flex-direction: column; align-items: center; gap: 30px; }
.sq .s5 .n { width: 84px; height: 84px; border-radius: 50%; border: 4px solid var(--ink); display: grid; place-items: center; font-size: 46px; font-weight: 700; }
.sq .s5 .t { font-size: 42px; font-weight: 700; line-height: 1.3; }
.sq .s5 .t small { display: block; font-size: 34px; font-weight: 400; color: var(--ink-2); margin-top: 8px; }
.sq .s5 .st1 { left: 72px; outline: 5px solid var(--accent); } .sq .s5 .st1 .n { border-color: var(--accent); color: var(--accent); }
.sq .s5 .st2 { left: 392px; } .sq .s5 .st3 { left: 712px; }
.sq .s5 .arr { position: absolute; top: 505px; width: 0; height: 0; border-top: 16px solid transparent; border-bottom: 16px solid transparent; border-left: 16px solid var(--ink-3); }
.sq .s5 .ar1 { left: 372px; } .sq .s5 .ar2 { left: 692px; }
.sq .s5 .head { position: absolute; left: 0; right: 0; top: 170px; font-size: 56px; font-weight: 700; }
.sq .s6 .map { position: absolute; left: 50%; transform: translateX(-50%); top: 90px; height: 500px; }
.sq .s6 .big { position: absolute; left: 0; right: 0; top: 650px; font-size: 62px; line-height: 1.35; }
.sq .s6 .rep { position: absolute; left: 0; right: 0; top: 880px; font-size: 36px; color: var(--ink-2); }
.sq .s7 .wordmark { position: absolute; left: 220px; top: 210px; width: 640px; height: 105px; -webkit-mask-position: center; mask-position: center; }
.sq .s7 .tag { position: absolute; left: 0; right: 0; top: 370px; font-size: 44px; color: var(--ink-2); }
.sq .s7 .btnwrap { position: absolute; left: 0; right: 0; top: 520px; }
.sq .s7 .btn { height: 124px; padding: 0 46px; font-size: 50px; }
.sq .s7 .url { position: absolute; left: 0; right: 0; top: 720px; font-size: 96px; }
.sq .thumb .big { position: absolute; left: 0; right: 0; top: 270px; font-size: 92px; }
.sq .thumb .sub { position: absolute; left: 0; right: 0; top: 590px; font-size: 52px; font-weight: 700; color: var(--accent); }
.sq .thumb .wordmark { position: absolute; left: 260px; top: 760px; width: 560px; height: 92px; -webkit-mask-position: center; mask-position: center; }
</style>
</head>
<body>
<div id="stage"></div>
<script>
// 場面の部品。文字は brand（brand.json）と、この中の決まった文だけ。
// data-in：場面の始まりから何秒で出すか。data-fx：rise（下から）／fade／draw（線を描く）
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const NOTE = '画面は架空のデータです（待ち時間は短く編集）';
const SCENES = {
  s1: () => `<div class="big"><span class="a" data-in="0.1">月末、また</span><br><span class="a" data-in="0.45"><span class="em">夜まで</span>事務作業？</span></div>`,
  s2: () => `<h2 class="a" data-in="0.05">こんな手間、ありませんか</h2>
    <div class="card c1 a" data-in="0.5"><i></i>見積書の単価さがし</div>
    <div class="card c2 a" data-in="1.8"><i></i>残業の集計</div>
    <div class="card c3 a" data-in="3.1"><i></i>外国語の問い合わせ</div>`,
  receipt: () => `<div class="big a" data-in="0.05">レシートの写真が、<br>Excelの表に。</div>
    <div class="shot a" data-in="0.25" data-clip="receipt"><img class="a0"><img class="b"></div><p class="note a" data-in="0.25">${NOTE}</p>`,
  knowledge: () => `<div class="big a" data-in="0.05">過去の見積書から、<br>根拠付きで答える。</div>
    <div class="shot a" data-in="0.25" data-clip="knowledge"><img class="a0"><img class="b"></div><p class="note a" data-in="0.25">${NOTE}</p>`,
  inn: () => `<div class="big a" data-in="0.05">返信の下書きは、自動で。<br>確認は、<span class="em">人が。</span></div>
    <div class="shot a" data-in="0.25" data-clip="inn"><img class="a0"><img class="b"></div><p class="note a" data-in="0.25">${NOTE}</p>`,
  s5: (f) => `${f === 'sq' ? '<div class="head a" data-in="0.05">進め方</div>' : ''}
    <div class="step st1 card a" data-in="0.2"><span class="n">1</span><span class="t">無料相談<small>60分</small></span></div>
    <div class="arr ar1 a" data-fx="fade" data-in="1.1"></div>
    <div class="step st2 card a" data-in="1.3"><span class="n">2</span><span class="t">お試し1ヶ月<small>5万円（税抜）</small></span></div>
    <div class="arr ar2 a" data-fx="fade" data-in="2.2"></div>
    <div class="step st3 card a" data-in="2.4"><span class="n">3</span><span class="t">結果を見て、<br>決める</span></div>`,
  s6: (f, b) => `<svg class="map" viewBox="${b.mapViewBox}"><path class="fill a" data-fx="fade" data-in="1.0" d="${b.mapPath}"/><path class="a" data-fx="draw" data-in="0.1" data-dur="1.3" pathLength="1" d="${b.mapPath}"/></svg>
    <div class="big a" data-in="0.9">山形で、<br>訪問してお手伝いします</div>
    <p class="rep a" data-in="1.5">${esc(b.rep)}</p>`,
  s7: (f, b, opt = {}) => `${opt.lead ? `<p class="lead a" data-in="0.05">${esc(opt.lead)}</p>` : ''}
    ${b.wordmarkUrl ? `<div class="wordmark a" data-in="${opt.lead ? 0.35 : 0.1}" role="img" aria-label="${esc(b.name)}"></div>` : `<div class="wordmark-text a big" data-in="0.1">${esc(b.name)}</div>`}
    <p class="tag a" data-in="${opt.lead ? 0.6 : 0.35}">${esc(b.tagline)}</p>
    <div class="btnwrap a" data-in="${opt.lead ? 0.9 : 0.7}"><span class="btn">まずは無料相談（60分）から</span></div>
    <p class="url a" data-in="${opt.lead ? 1.1 : 0.95}">${esc(b.url)}</p>`,
  thumb: (f, b, opt = {}) => `<div class="big">${opt.hook ? '月末、また<br><span class="em">夜まで</span>事務作業？' : '事務の手間を、<br><span class="em">ITで</span>減らすお手伝い'}</div>
    <p class="sub">山形で訪問・無料相談60分</p>
    ${b.wordmarkUrl ? `<div class="wordmark" role="img" aria-label="${esc(b.name)}"></div>` : `<p class="big">${esc(b.name)}</p>`}`,
};
const DEMO = new Set(['receipt', 'knowledge', 'inn']);

let plan = null; // { format, scenes: [{ id, start, end, opt }] }
const clamp = (x) => Math.max(0, Math.min(1, x));
const ease = (k) => 1 - Math.pow(1 - k, 3);
const FADE = 0.22;

window.setup = (p) => {
  plan = p;
  document.body.className = p.format === 'sq' ? 'sq' : 'v';
  const b = p.brand;
  if (b.wordmarkUrl) document.documentElement.style.setProperty('--wm', `url("${b.wordmarkUrl}")`);
  const stage = document.getElementById('stage');
  stage.innerHTML = p.scenes.map((s, i) => {
    const cls = `scene ${s.id} ${DEMO.has(s.id) ? 'demo' : ''} ${s.opt?.lead ? 'withlead' : ''}`;
    return `<section class="${cls}" data-i="${i}">${SCENES[s.id](p.format, b, s.opt)}</section>`;
  }).join('');
  return document.fonts.ready.then(() => true);
};

// t 秒の画面にする。clips：{ receipt: { a, b, mix }, inn: {...} }（画像のパス）
window.renderAt = async (t, clips = {}) => {
  const waits = [];
  document.querySelectorAll('.scene').forEach((el) => {
    const s = plan.scenes[+el.dataset.i];
    const first = s.start === 0; const last = s.end >= plan.duration;
    let o = 0;
    if (t >= s.start && t < s.end + (last ? 1 : 0)) {
      o = 1;
      if (!first) o = Math.min(o, clamp((t - s.start) / FADE));
      if (!last) o = Math.min(o, clamp((s.end - t) / FADE));
    }
    el.style.opacity = o;
    el.style.display = o > 0 ? '' : 'none';
    if (o === 0) return;
    const lt = t - s.start;
    el.querySelectorAll('.a').forEach((a) => {
      const k = ease(clamp((lt - +(a.dataset.in || 0)) / +(a.dataset.dur || 0.45)));
      const fx = a.dataset.fx || 'rise';
      if (fx === 'draw') { a.style.strokeDasharray = '1'; a.style.strokeDashoffset = String(1 - k); return; }
      a.style.opacity = k;
      if (fx === 'rise') a.style.translate = `0 ${(1 - k) * 36}px`;
    });
    const shot = el.querySelector('.shot');
    if (shot && clips[shot.dataset.clip]) {
      const c = clips[shot.dataset.clip];
      const [ia, ib] = shot.querySelectorAll('img');
      if (ia.getAttribute('src') !== c.a) { ia.src = c.a; waits.push(ia.decode().catch(() => {})); }
      if (c.b) { if (ib.getAttribute('src') !== c.b) { ib.src = c.b; waits.push(ib.decode().catch(() => {})); } ib.style.opacity = c.mix; }
      else ib.style.opacity = 0;
    } else if (shot && !shot.querySelector('.wait')) {
      shot.insertAdjacentHTML('beforeend', '<div class="wait">（この録画は<br>差し替え待ち）</div>');
    }
  });
  await Promise.all(waits);
  return true;
};
</script>
</body>
</html>
