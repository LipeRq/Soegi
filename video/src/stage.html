<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Nodus Consulting SNS動画の舞台</title>
<style>
/* 書体：BIZ UDPGothic（@fontsource/biz-udpgothic、SIL OFL 1.1） */
@font-face { font-family: "BIZ UDPGothic"; src: url(../node_modules/@fontsource/biz-udpgothic/files/biz-udpgothic-japanese-400-normal.woff2); font-weight: 400; }
@font-face { font-family: "BIZ UDPGothic"; src: url(../node_modules/@fontsource/biz-udpgothic/files/biz-udpgothic-japanese-700-normal.woff2); font-weight: 700; }
@font-face { font-family: "BIZ UDPGothic"; src: url(../node_modules/@fontsource/biz-udpgothic/files/biz-udpgothic-latin-400-normal.woff2); font-weight: 400; unicode-range: U+0000-00FF, U+2000-206F, U+20AC, U+2122; }
@font-face { font-family: "BIZ UDPGothic"; src: url(../node_modules/@fontsource/biz-udpgothic/files/biz-udpgothic-latin-700-normal.woff2); font-weight: 700; unicode-range: U+0000-00FF, U+2000-206F, U+20AC, U+2122; }

/* 色は withsoegi.jp（css/site.css）に合わせる。光る演出（ぼかし・発光）は使わない */
:root {
  --paper: #E9EEED; --surface: #FFFFFF; --ink: #1B2428; --ink-2: #44525A; --ink-3: #5A676E;
  --line: #D5DDDF; --accent: #1A6D73; --accent-soft: #DCF0F0; --accent-bright: #3FA3A9; --leaf: #2E7652;
  --dx: 0px; --dy: 0px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: var(--paper); overflow: hidden; }
body { font-family: "BIZ UDPGothic", sans-serif; color: var(--ink); font-feature-settings: "palt" 1; -webkit-font-smoothing: antialiased; }
#stage { position: relative; overflow: hidden; background: var(--paper); }

/* 背景：ゆっくり流れる点の格子と、大きな輪 */
.bg { position: absolute; inset: 0; }
.dots { position: absolute; inset: -80px; background-image: radial-gradient(rgba(27,36,40,.13) 2.2px, transparent 2.6px); background-size: 44px 44px; background-position: var(--dx) var(--dy); }
.ring { position: absolute; border-radius: 50%; border: 3px solid rgba(26,109,115,.16); }
.blob { position: absolute; border-radius: 50%; background: rgba(220,240,240,.75); }

.scene { position: absolute; inset: 0; display: none; }
.scene.dark { background: var(--ink); color: #fff; }
.scene.dark::before { content: ""; position: absolute; inset: -80px; background-image: radial-gradient(rgba(255,255,255,.09) 2.2px, transparent 2.6px); background-size: 44px 44px; background-position: var(--dx) var(--dy); }
.a { will-change: transform, opacity; }
.em { color: var(--accent); }
.dark .em { color: var(--accent-bright); }

/* 文字：行ごとにマスクから出す */
.big { font-weight: 700; line-height: 1.28; letter-spacing: .01em; }
.ln { display: block; overflow: hidden; padding: 0 .04em .08em; margin-bottom: -.08em; }
.ln > span { display: inline-block; }
.ln.free { overflow: visible; }
.v .sqbr { display: none; }
.mk { position: relative; z-index: 0; }
.mk::before { content: ""; position: absolute; left: -.06em; right: -.06em; bottom: .04em; height: .36em; background: var(--accent-soft); z-index: -1; transform-origin: left center; transform: scaleX(var(--mk, 0)); }
.dark .mk::before { background: rgba(63,163,169,.32); }

.card { background: var(--surface); border-radius: 24px; box-shadow: 0 1px 2px rgba(29,35,39,.06), 0 18px 36px -16px rgba(29,35,39,.24); }
.ico { flex: none; width: 92px; height: 92px; border-radius: 22px; background: var(--accent-soft); display: grid; place-items: center; }
.ico svg { width: 56px; height: 56px; fill: none; stroke: var(--accent); stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }

/* デモの画面：ブラウザの窓の形 */
.win { position: absolute; border-radius: 26px; overflow: hidden; background: #fff; box-shadow: 0 2px 4px rgba(29,35,39,.10), 0 40px 70px -30px rgba(29,35,39,.45); transform-origin: 50% 100%; }
.win .bar { height: var(--barh); background: #F4F7F7; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 12px; padding: 0 22px; color: var(--ink-3); font-size: calc(var(--barh) * .4); }
.win .bar i { width: calc(var(--barh) * .22); height: calc(var(--barh) * .22); border-radius: 50%; background: var(--line); flex: none; }
.win .bar .addr { margin-left: 8px; flex: 1; height: calc(var(--barh) * .62); border-radius: 999px; background: #fff; border: 1px solid var(--line); display: flex; align-items: center; padding: 0 16px; gap: 8px; }
.win .bar svg { width: 1em; height: 1em; fill: none; stroke: var(--ink-3); stroke-width: 2.2; }
.win .scr { position: relative; overflow: hidden; }
.win .zoom { position: absolute; inset: 0; }
.win .zoom img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.win .zoom img.b { opacity: 0; }
.tapr { position: absolute; width: 120px; height: 120px; margin: -60px 0 0 -60px; border-radius: 50%; border: 6px solid var(--accent); opacity: 0; }
.tapd { position: absolute; width: 54px; height: 54px; margin: -27px 0 0 -27px; border-radius: 50%; background: rgba(26,109,115,.35); opacity: 0; }
.chip { position: absolute; transform-origin: 50% 100%; background: var(--accent); color: #fff; font-weight: 700; border-radius: 18px; padding: 16px 28px; white-space: nowrap; box-shadow: 0 16px 30px -14px rgba(16,74,79,.6); }
.chip::after { content: ""; position: absolute; left: 50%; margin-left: -14px; border: 14px solid transparent; }
.chip.down::after { top: 100%; border-top-color: var(--accent); }
.chip.up { transform-origin: 50% 0; }
.chip.up::after { bottom: 100%; border-bottom-color: var(--accent); }
.note { position: absolute; color: var(--ink-3); line-height: 1.3; }

/* 進め方 */
.step { position: absolute; display: flex; align-items: center; gap: 34px; }
.n { width: 88px; height: 88px; border-radius: 50%; background: var(--surface); border: 5px solid var(--ink); display: grid; place-items: center; font-size: 46px; font-weight: 700; flex: none; }
.st1 .n { border-color: var(--accent); color: #fff; background: var(--accent); }
.t { font-weight: 700; line-height: 1.25; }
.t small { display: block; font-weight: 400; color: var(--ink-2); margin-top: 6px; }
.stamp { position: absolute; border-radius: 50%; border: 5px solid var(--accent); color: var(--accent); font-weight: 700; display: grid; place-items: center; }
.conn { position: absolute; background: var(--accent); transform-origin: 0 0; }
.chk { fill: none; stroke: var(--leaf); stroke-width: 9; stroke-linecap: round; stroke-linejoin: round; }

.map path { fill: none; stroke: var(--ink); stroke-width: 5; stroke-linejoin: round; vector-effect: non-scaling-stroke; }
.map path.fill { fill: var(--accent-soft); stroke: none; }
.pin { position: absolute; width: 84px; height: 112px; margin: -112px 0 0 -42px; }
.pin svg { width: 100%; height: 100%; }
.ripple { position: absolute; width: 60px; height: 22px; margin: -11px 0 0 -30px; border-radius: 50%; border: 4px solid var(--accent); opacity: 0; }

.wordmark { background: var(--ink); -webkit-mask: var(--wm) left center / contain no-repeat; mask: var(--wm) left center / contain no-repeat; }
.btn { position: relative; display: inline-flex; align-items: center; justify-content: center; background: var(--accent); color: #fff; font-weight: 700; border-radius: 999px; }
.pulse { position: absolute; inset: 0; border-radius: 999px; border: 4px solid var(--accent); opacity: 0; }
.ptr { position: absolute; width: 64px; height: 64px; border-radius: 50%; background: rgba(27,36,40,.82); border: 5px solid #fff; opacity: 0; }
.url { font-weight: 700; letter-spacing: .01em; white-space: nowrap; }
.caret { display: inline-block; width: .08em; height: .9em; background: var(--accent); vertical-align: -.08em; margin-left: .04em; }
.clock { font-weight: 700; letter-spacing: .04em; font-variant-numeric: tabular-nums; color: rgba(255,255,255,.92); }
.clock .colon { color: var(--accent-bright); }
.clock small { display: block; font-size: .22em; letter-spacing: .1em; color: rgba(255,255,255,.62); font-weight: 400; margin-bottom: .2em; }

/* 場面の切り替え：斜めの帯が横切る */
.wipe { position: absolute; top: -10%; bottom: -10%; left: -30%; width: 160%; transform: skewX(-14deg) translateX(130%); pointer-events: none; }
.wipe.w1 { background: var(--accent); }
.wipe.w2 { background: var(--ink); }

/* ---------- 縦（1080×1920）：左揃え。上250px・下400pxと右側のボタン列（x>930, y>880）に文字を置かない ---------- */

.v .s2 .card { position: absolute; left: 80px; width: 850px; height: 188px; display: flex; align-items: center; gap: 36px; padding: 0 40px; font-size: 64px; font-weight: 700; }
.v .s2 .c1 { top: 560px; } .v .s2 .c2 { top: 778px; } .v .s2 .c3 { top: 996px; }
.v .demo .big { position: absolute; left: 80px; top: 300px; font-size: 74px; }
.v .demo .win { left: 105px; top: 548px; width: 800px; --barh: 58px; }
.v .demo .scr { height: 837px; }
.v .demo .chip { font-size: 44px; }

.v .s5 h2 { position: absolute; left: 80px; top: 330px; font-size: 64px; font-weight: 700; }
.v .s5 .step { left: 80px; width: 850px; height: 200px; }
.v .s5 .st1 { top: 470px; } .v .s5 .st2 { top: 740px; } .v .s5 .st3 { top: 1010px; }
.v .s5 .t { font-size: 64px; } .v .s5 .t small { font-size: 44px; }
.v .s5 .conn { left: 120px; top: 570px; width: 8px; height: 540px; }
.v .s5 .stamp { left: 690px; top: 455px; width: 190px; height: 190px; font-size: 60px; }
.v .s5 .chkw { position: absolute; left: 800px; top: 1050px; width: 120px; height: 120px; }
.v .s6 .map { position: absolute; left: 340px; top: 300px; height: 660px; }
.v .s6 .big { position: absolute; left: 80px; top: 1040px; font-size: 76px; }

.v .s7 .lead { position: absolute; left: 80px; top: 400px; font-size: 56px; font-weight: 700; }
.v .s7 .wordmark { position: absolute; left: 80px; top: 540px; width: 800px; height: 132px; }
.v .s7 .tag { position: absolute; left: 80px; top: 720px; font-size: 52px; color: var(--ink-2); }
.v .s7 .btnwrap { position: absolute; left: 80px; top: 880px; }

.v .s7 .url { position: absolute; left: 80px; top: 1100px; font-size: 112px; }
.v .s7.withlead .wordmark { top: 560px; } .v .s7.withlead .tag { top: 730px; } .v .s7.withlead .btnwrap { top: 890px; } .v .s7.withlead .url { top: 1100px; }
.v .thumb .big { position: absolute; left: 80px; top: 330px; font-size: 96px; }
.v .thumb .sub { position: absolute; left: 80px; top: 640px; font-size: 54px; font-weight: 700; color: var(--accent); }
.v .thumb.dark .sub { color: var(--accent-bright); }
.v .thumb .wordmark { position: absolute; left: 80px; top: 760px; width: 520px; height: 86px; }
.v .thumb.dark .wordmark { background: #fff; }
.v .thumb .win { left: 150px; top: 920px; width: 780px; --barh: 56px; transform: rotate(-4deg); }

/* ---------- 正方形（1080×1080）：中央揃え。四方72px ---------- */
.sq #stage { width: 1080px; height: 1080px; }
.sq .scene { text-align: center; }
.sq .ln { margin-left: auto; margin-right: auto; }
.sq .s1 .clock { position: absolute; left: 0; right: 0; top: 150px; font-size: 140px; }
.sq .s1 .big { position: absolute; left: 0; right: 0; top: 520px; font-size: 100px; }

.sq .s2 .c1 { top: 260px; } .sq .s2 .c2 { top: 470px; } .sq .s2 .c3 { top: 680px; }
.sq .demo .big { position: absolute; left: 0; right: 0; top: 60px; font-size: 60px; }
.sq .demo .win { left: 240px; top: 250px; width: 600px; --barh: 44px; }
.sq .demo .scr { height: 628px; }

.sq .demo .note { left: 0; right: 0; top: 960px; font-size: 26px; }
.sq .s5 h2 { position: absolute; left: 0; right: 0; top: 150px; font-size: 58px; font-weight: 700; }
.sq .s5 .step { top: 330px; width: 296px; height: 380px; flex-direction: column; justify-content: flex-start; padding-top: 30px; gap: 26px; }
.sq .s5 .st1 { left: 72px; } .sq .s5 .st2 { left: 392px; } .sq .s5 .st3 { left: 712px; }
.sq .s5 .t { font-size: 44px; } .sq .s5 .t small { font-size: 34px; }
.sq .s5 .conn { left: 220px; top: 400px; width: 640px; height: 8px; }
.sq .s5 .stamp { left: 210px; top: 640px; width: 150px; height: 150px; font-size: 48px; }
.sq .s5 .chkw { position: absolute; left: 815px; top: 640px; width: 110px; height: 110px; }
.sq .s6 .map { position: absolute; left: 395px; top: 70px; height: 520px; }
.sq .s6 .big { position: absolute; left: 0; right: 0; top: 640px; font-size: 64px; }
.sq .s6 .rep { position: absolute; left: 0; right: 0; top: 880px; font-size: 36px; color: var(--ink-2); }
.sq .s7 .wordmark { position: absolute; left: 210px; top: 190px; width: 660px; height: 110px; -webkit-mask-position: center; mask-position: center; }
.sq .s7 .tag { position: absolute; left: 0; right: 0; top: 350px; font-size: 46px; color: var(--ink-2); }

.sq .thumb .scr { height: 649px; }
</style>

<body>
<div id="stage"></div>
<script>
// 場面の部品。文字は brand（brand.json）と、この中の決まった文だけ。
// 動かす要素は class="a" と data-fx（動き方）・data-in（場面の始まりから何秒）・data-dur（何秒かけて）。
// data-sfx を付けた要素は、出る時刻に効果音を鳴らす（setup() が一覧にして返す）。
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const NOTE = '画面は架空のデータです（待ち時間は短く編集）';
const LOCK = '<svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>';
const ICONS = {
  doc: '<svg viewBox="0 0 48 48"><path class="a" data-fx="draw" data-dur="0.6" pathLength="1" d="M12 5h17l8 8v30H12z M29 5v8h8 M18 22h13 M18 29h13 M18 36h8"/></svg>',
  clock: '<svg viewBox="0 0 48 48"><circle class="a" data-fx="draw" data-dur="0.6" pathLength="1" cx="24" cy="24" r="17"/><path class="a" data-fx="draw" data-dur="0.5" pathLength="1" d="M24 13v11l7 5"/></svg>',
  chat: '<svg viewBox="0 0 48 48"><path class="a" data-fx="draw" data-dur="0.6" pathLength="1" d="M6 9h24v16H16l-6 5v-5H6z M34 17h8v16h-4v5l-6-5H20v-4"/></svg>',
};
const lines = (arr, t0, step = 0.12, sfx = '') => arr.map((l, i) => `<span class="ln"><span class="a" data-fx="line" data-in="${(t0 + i * step).toFixed(2)}"${i === 0 && sfx ? ` data-sfx="${sfx}"` : ''}>${l}</span></span>`).join('');

// デモの場面の時刻（場面の長さ 5秒／4秒 で変える）。tap：例文を押す所、zoom：拡大の開始、chip：吹き出し
const DEMO_T = {
  knowledge: { 5: { tap: 0.75, zoom: 3.2, chip: 3.55 }, 4: { tap: 0.66, zoom: 2.45, chip: 2.8 } },
  inn: { 5: { tap: 0.75, zoom: 3.3, chip: 3.65 }, 4: { tap: 0.55, zoom: 2.6, chip: 2.95 } },
};
const DEMO_LOOK = {
  knowledge: { head: ['過去の見積書から、', '<span class="mk a" data-fx="mark" data-in="0.7">根拠付き</span>で答える。'], zx: 0.5, zy: 0.66, zs: 1.32, tx: 0.45, ty: 0.29, chip: '根拠の行に、印', dir: 'down', cx: 0.5, cy: 0.38 },
  inn: { head: ['返信の下書きは、自動で。', '確認は、<span class="em mk a" data-fx="mark" data-in="0.7">人が。</span>'], zx: 0.5, zy: 0.34, zs: 1.3, tx: 0.45, ty: 0.3, chip: '送る前の確認点', dir: 'up', cx: 0.5, cy: 0.86 },
};
function demoScene(id, f, b, opt) {
  const L = DEMO_LOOK[id]; const T = DEMO_T[id][opt.dur >= 5 ? 5 : 4];
  return `<div class="big">${lines(L.head, 0.12)}</div>
    <div class="win a" data-fx="device" data-in="0.2" data-dur="0.8" data-sfx="rise">
      <div class="bar"><i></i><i></i><i></i><div class="addr">${LOCK}demo.withsoegi.jp</div></div>
      <div class="scr">
        <div class="zoom a" data-fx="zoom" data-in="${T.zoom}" data-dur="0.75" data-zx="${L.zx}" data-zy="${L.zy}" data-zs="${L.zs}" data-clip="${id}" data-sfx="zoom"><img class="a0"><img class="b"></div>
        <div class="tapd a" data-fx="tapd" data-in="${T.tap - 0.15}" data-dur="0.5" style="left:${L.tx * 100}%;top:${L.ty * 100}%"></div>
        <div class="tapr a" data-fx="ripple" data-in="${T.tap}" data-dur="0.55" data-sfx="tap" style="left:${L.tx * 100}%;top:${L.ty * 100}%"></div>
        <div class="chip ${L.dir} a" data-fx="chip" data-in="${T.chip}" data-dur="0.5" data-sfx="pop" style="left:${L.cx * 100}%;top:${L.cy * 100}%">${L.chip}</div>
      </div>
    </div>
    <p class="note a" data-fx="fade" data-in="0.5">${NOTE}</p>`;
}

const SCENES = {
  s1: () => `<div class="clock a" data-fx="clock" data-in="0.0" data-dur="1.35" data-from="18:00" data-to="22:47" data-sfx="ticks"><small>月末の夜</small><span class="v">18<span class="colon">:</span>00</span></div>
    <div class="big">${lines(['月末、また'], 0.2)}<span class="ln free"><span class="a" data-fx="slam" data-in="0.62" data-dur="0.5" data-sfx="slam"><span class="em">夜まで</span>事務作業？</span></span></div>`,
  s2: () => `<h2>${lines(['こんな手間、ありませんか'], 0.05)}</h2>
    <div class="card c1 a" data-fx="pop" data-in="0.45" data-out="4.55" data-sfx="pop"><span class="ico">${ICONS.doc}</span>見積書の単価さがし</div>
    <div class="card c2 a" data-fx="pop" data-in="1.45" data-out="4.62" data-sfx="pop"><span class="ico">${ICONS.clock}</span>残業の集計</div>
    <div class="card c3 a" data-fx="pop" data-in="2.45" data-out="4.69" data-sfx="pop"><span class="ico">${ICONS.chat}</span>外国語の問い合わせ</div>`,
  receipt: (f, b, opt) => demoScene('receipt', f, b, opt),
  knowledge: (f, b, opt) => demoScene('knowledge', f, b, opt),
  inn: (f, b, opt) => demoScene('inn', f, b, opt),
  s5: () => `<h2>${lines(['進め方は、3ステップ'], 0.05)}</h2>
    <div class="conn a" data-fx="${'grow'}" data-in="0.5" data-dur="2.2"></div>
    <div class="step st1 a" data-fx="pop" data-in="0.35" data-sfx="pop"><span class="n">1</span><span class="t">無料相談<small>60分</small></span></div>
    <div class="stamp a" data-fx="stamp" data-in="0.85" data-dur="0.4" data-sfx="stamp">無料</div>
    <div class="step st2 a" data-fx="pop" data-in="1.35" data-sfx="pop"><span class="n">2</span><span class="t">お試し1ヶ月<small>5万円（税抜）</small></span></div>
    <div class="step st3 a" data-fx="pop" data-in="2.35" data-sfx="pop"><span class="n">3</span><span class="t">結果を見て、<br class="sqbr">決める</span></div>
    <svg class="chkw" viewBox="0 0 60 60"><path class="chk a" data-fx="draw" data-in="2.75" data-dur="0.4" data-sfx="check" pathLength="1" d="M12 31l12 12 24-26"/></svg>`,
  s6: (f, b) => {
    const [vx, vy, vw, vh] = b.mapViewBox.split(' ').map(Number);
    return `<div class="mapwrap"><svg class="map" viewBox="${b.mapViewBox}"><path class="fill a" data-fx="fade" data-in="0.9" d="${b.mapPath}"/><path class="a" data-fx="draw" data-in="0.05" data-dur="1.2" data-sfx="draw" pathLength="1" d="${b.mapPath}"/></svg></div>
    <div class="ripple a" data-fx="ring" data-in="1.45" data-dur="0.9" data-pin="${b.mapPin}"></div>
    <div class="pin a" data-fx="drop" data-in="1.05" data-dur="0.5" data-sfx="drop" data-pin="${b.mapPin}"><svg viewBox="0 0 60 80"><path d="M30 78C30 78 4 46 4 28a26 26 0 0 1 52 0c0 18-26 50-26 50z" fill="#1A6D73"/><circle cx="30" cy="28" r="10" fill="#fff"/></svg></div>
    <div class="big">${lines(['山形で、', '訪問してお手伝いします'], 0.55)}</div>
    <p class="rep a" data-fx="rise" data-in="1.3">${esc(b.rep)}</p>`;
  },
  s7: (f, b, opt = {}) => {
    const o = opt.lead ? 0.4 : 0;
    return `${opt.lead ? `<p class="lead">${lines([esc(opt.lead)], 0.08)}</p>` : ''}
    ${b.wordmarkUrl ? `<div class="wordmark a" data-fx="wipe" data-in="${0.05 + o}" data-dur="0.6" role="img" aria-label="${esc(b.name)}"></div>` : `<div class="big a" data-fx="rise" data-in="${0.05 + o}">${esc(b.name)}</div>`}
    <p class="tag a" data-fx="rise" data-in="${0.3 + o}">${esc(b.tagline)}</p>
    <div class="btnwrap"><span class="btn a" data-fx="btn" data-in="${0.55 + o}" data-dur="0.45" data-press="${1.85 + o * 1.6}" data-sfx="pop"><span class="pulse a" data-fx="pulse" data-in="${2.0 + o * 1.6}"></span>まずは無料相談（60分）から<span class="ptr a" data-fx="ptr" data-in="${1.45 + o * 1.6}" data-press="${1.85 + o * 1.6}" data-sfx="click" data-sfxoff="0.4"></span></span></div>
    <p class="url a" data-fx="type" data-in="${0.95 + o * 1.2}" data-dur="0.55" data-text="${esc(b.url)}" data-sfx="type"></p>`;
  },
  thumb: (f, b, opt = {}) => `<div class="big">${opt.hook ? '月末、また<br><span class="em">夜まで</span>事務作業？' : '事務の手間を、<br><span class="em">ITで</span>減らすお手伝い'}</div>
    <p class="sub">山形で訪問・無料相談60分</p>
    ${b.wordmarkUrl ? `<div class="wordmark" role="img" aria-label="${esc(b.name)}"></div>` : `<p class="sub">${esc(b.name)}</p>`}
    ${opt.shot ? `<div class="win"><div class="bar"><i></i><i></i><i></i><div class="addr">${LOCK}demo.withsoegi.jp</div></div><div class="scr"><div class="zoom"><img src="${opt.shot}"></div></div></div>` : ''}`,
};
const DEMO = new Set(['receipt', 'knowledge', 'inn']);
const DARK = new Set(['s1']);

let plan = null;
const clamp = (x) => Math.max(0, Math.min(1, x));
const E = {
  expo: (k) => (k >= 1 ? 1 : 1 - Math.pow(2, -10 * k)),
  cubic: (k) => 1 - Math.pow(1 - k, 3),
  back: (k) => { const c1 = 2.0, c3 = c1 + 1; return 1 + c3 * Math.pow(k - 1, 3) + c1 * Math.pow(k - 1, 2); },
  inout: (k) => (k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2),
  bounce: (k) => { const n = 7.5625, d = 2.75; if (k < 1 / d) return n * k * k; if (k < 2 / d) return n * (k -= 1.5 / d) * k + 0.75; if (k < 2.5 / d) return n * (k -= 2.25 / d) * k + 0.9375; return n * (k -= 2.625 / d) * k + 0.984375; },
};
const WIPE = 0.34; // 切り替えの帯が横切る時間の半分

window.setup = (p) => {
  plan = p;
  document.body.className = p.format === 'sq' ? 'sq' : 'v';
  const b = p.brand;
  if (b.wordmarkUrl) document.documentElement.style.setProperty('--wm', `url("${b.wordmarkUrl}")`);
  const stage = document.getElementById('stage');
  const sq = p.format === 'sq';
  const W = sq ? 1080 : 1080, H = sq ? 1080 : 1920;
  stage.innerHTML = `<div class="bg"><div class="dots"></div>
      <div class="blob" id="blob1" style="width:${sq ? 620 : 900}px;height:${sq ? 620 : 900}px"></div>
      <div class="ring" id="ring1" style="width:${sq ? 760 : 1100}px;height:${sq ? 760 : 1100}px"></div>
      <div class="ring" id="ring2" style="width:${sq ? 300 : 420}px;height:${sq ? 300 : 420}px"></div></div>`
    + p.scenes.map((s, i) => {
      const dur = s.end - s.start;
      const cls = `scene ${s.id} ${DEMO.has(s.id) ? 'demo' : ''} ${DARK.has(s.id) || s.opt?.dark ? 'dark' : ''} ${s.opt?.lead ? 'withlead' : ''}`;
      return `<section class="${cls}" data-i="${i}">${SCENES[s.id](p.format, b, { ...(s.opt || {}), dur })}</section>`;
    }).join('')
    + '<div class="wipe w2" id="wipe2"></div><div class="wipe w1" id="wipe1"></div>';
  // 地図のピンの位置（地図の中の割合 → 画面の座標）。測るあいだだけ場面を表示する
  document.querySelectorAll('.scene').forEach((el) => { el.style.display = 'block'; });
  document.querySelectorAll('[data-pin]').forEach((el) => {
    const svg = el.parentElement.querySelector('svg.map');
    const r = svg.getBoundingClientRect(); const st = stage.getBoundingClientRect();
    const [px, py] = el.dataset.pin.split(',').map(Number);
    el.style.left = `${r.left - st.left + r.width * px}px`; el.style.top = `${r.top - st.top + r.height * py}px`;
  });
  document.querySelectorAll('.scene').forEach((el) => { el.style.display = 'none'; });
  // 効果音の一覧
  const cues = [];
  document.querySelectorAll('.scene').forEach((el) => {
    const s = p.scenes[+el.dataset.i];
    el.querySelectorAll('[data-sfx]').forEach((a) => cues.push({ t: +(s.start + +(a.dataset.in || 0) + +(a.dataset.sfxoff || 0)).toFixed(3), sfx: a.dataset.sfx, scene: s.id }));
    if (s.start > 0) cues.push({ t: +(s.start - 0.3).toFixed(3), sfx: 'whoosh', scene: s.id });
  });
  return document.fonts.ready.then(() => cues.sort((x, y) => x.t - y.t));
};

function animate(a, lt, t) {
  const t0 = +(a.dataset.in || 0); const dur = +(a.dataset.dur || 0.55);
  const k = clamp((lt - t0) / dur);
  const fx = a.dataset.fx || 'rise';
  let exit = 0;
  if (a.dataset.out) exit = E.inout(clamp((lt - +a.dataset.out) / 0.3));
  switch (fx) {
    case 'line': a.style.transform = `translateY(${(1 - E.expo(k)) * 110}%)`; break;
    case 'rise': { const e = E.expo(k); a.style.opacity = e; a.style.transform = `translateY(${(1 - e) * 50}px)`; break; }
    case 'fade': a.style.opacity = E.cubic(k); break;
    case 'mark': a.style.setProperty('--mk', E.expo(clamp((lt - t0) / 0.5))); break;
    case 'pop': {
      const e = E.back(k); const o = clamp(k * 3);
      a.style.opacity = o * (1 - exit);
      a.style.transform = `translateX(${-exit * 140}px) translateY(${(1 - E.expo(k)) * 60}px) scale(${0.82 + 0.18 * e})`;
      break;
    }
    case 'slam': {
      const e = E.back(k); a.style.opacity = clamp(k * 4);
      a.style.transform = `scale(${1.5 - 0.5 * e})`; a.style.transformOrigin = '0 70%';
      break;
    }
    case 'draw': a.style.strokeDasharray = '1'; a.style.strokeDashoffset = String(1 - E.inout(k)); break;
    case 'grow': {
      const e = E.inout(k); const sq = plan.format === 'sq';
      a.style.transform = sq ? `scaleX(${e})` : `scaleY(${e})`; break;
    }
    case 'stamp': { const e = E.back(k); a.style.opacity = clamp(k * 3); a.style.transform = `rotate(${-28 + 16 * e}deg) scale(${1.8 - 0.8 * e})`; break; }
    case 'device': {
      const e = E.expo(k); const fl = Math.sin(t * 1.7) * 6 * e;
      a.style.opacity = clamp(k * 3);
      a.style.transform = `perspective(1600px) translateY(${(1 - e) * 260 + fl}px) rotateX(${(1 - e) * 22}deg) scale(${0.92 + 0.08 * e})`;
      break;
    }
    case 'zoom': {
      const e = E.inout(k); const s = 1 + (+a.dataset.zs - 1) * e;
      a.style.transformOrigin = `${a.dataset.zx * 100}% ${a.dataset.zy * 100}%`; a.style.transform = `scale(${s})`;
      break;
    }
    case 'tapd': a.style.opacity = lt < t0 ? 0 : Math.sin(Math.PI * k) * 1; a.style.transform = `scale(${0.6 + 0.4 * E.expo(k)})`; break;
    case 'ripple': a.style.opacity = lt < t0 ? 0 : (1 - k) * 0.9; a.style.transform = `scale(${0.3 + 1.0 * E.expo(k)})`; break;
    case 'chip': { const e = E.back(k); a.style.opacity = clamp(k * 3); a.style.transform = `translate(-50%, ${a.classList.contains('down') ? '-100%' : '0'}) scale(${0.5 + 0.5 * e})`; break; }
    case 'drop': {
      const e = E.bounce(k); a.style.opacity = clamp(k * 5);
      a.style.transform = `translateY(${(e - 1) * 260}px)`; break;
    }
    case 'ring': { const n = lt < t0 ? -1 : ((lt - t0) % dur) / dur; a.style.opacity = n < 0 ? 0 : (1 - n) * 0.85; a.style.transform = `scale(${1 + n * 2.6})`; break; }
    case 'wipe': { const e = E.expo(k); a.style.clipPath = `inset(0 ${(1 - e) * 100}% 0 0)`; break; }
    case 'btn': {
      const e = E.back(k); const press = +a.dataset.press; const pk = clamp((lt - press) / 0.22);
      const ps = lt >= press ? 1 - 0.07 * Math.sin(Math.PI * pk) : 1;
      a.style.opacity = clamp(k * 3); a.style.transform = `scale(${(0.6 + 0.4 * e) * ps})`; break;
    }
    case 'pulse': { const n = lt < t0 ? -1 : ((lt - t0) % 0.9) / 0.9; a.style.opacity = n < 0 ? 0 : (1 - n) * 0.8; a.style.transform = `scale(${1 + n * 0.22}, ${1 + n * 0.5})`; break; }
    case 'ptr': {
      const press = +a.dataset.press; const e = E.expo(k);
      const pk = clamp((lt - press) / 0.2); const sc = lt >= press ? 1 - 0.25 * Math.sin(Math.PI * pk) : 1;
      a.style.opacity = clamp(k * 3);
      a.style.right = '-10px'; a.style.bottom = '-34px';
      a.style.transform = `translate(${(1 - e) * 200}px, ${(1 - e) * 160}px) scale(${sc})`; break;
    }
    case 'type': {
      const text = a.dataset.text; const n = Math.round(text.length * clamp((lt - t0) / dur));
      const blink = lt < t0 ? 0 : (lt - t0 < dur + 0.2 ? 1 : (Math.floor((lt - t0) * 2.2) % 2 ? 0 : 1));
      a.innerHTML = esc(text.slice(0, n)) + `<span class="caret" style="opacity:${blink}"></span>`;
      break;
    }
    case 'clock': {
      const [h0, m0] = a.dataset.from.split(':').map(Number); const [h1, m1] = a.dataset.to.split(':').map(Number);
      const mm = Math.round(h0 * 60 + m0 + (h1 * 60 + m1 - h0 * 60 - m0) * E.cubic(k));
      const v = a.querySelector('.v');
      v.innerHTML = `${String(Math.floor(mm / 60)).padStart(2, '0')}<span class="colon">:</span>${String(mm % 60).padStart(2, '0')}`;
      a.style.opacity = clamp((lt + 0.05) / 0.25);
      a.style.transform = `translateY(${(1 - E.expo(clamp((lt + 0.05) / 0.6))) * 40}px)`;
      break;
    }
  }
}

// t 秒の画面にする。clips：{ knowledge: { a, b, mix }, inn: {...} }（画像のパス）
window.renderAt = async (t, clips = {}) => {
  const waits = [];
  const st = document.documentElement.style;
  st.setProperty('--dx', `${(t * 18) % 44}px`); st.setProperty('--dy', `${(t * 26) % 44}px`);
  const sq = plan.format === 'sq'; const W = 1080, H = sq ? 1080 : 1920;
  const b1 = document.getElementById('blob1'), r1 = document.getElementById('ring1'), r2 = document.getElementById('ring2');
  b1.style.left = `${W * 0.55 + Math.sin(t * 0.35) * 60}px`; b1.style.top = `${H * (sq ? 0.5 : 0.6) + Math.cos(t * 0.3) * 80}px`;
  r1.style.left = `${-W * 0.35 + Math.sin(t * 0.25) * 40}px`; r1.style.top = `${-H * (sq ? 0.25 : 0.12) + Math.cos(t * 0.2) * 50}px`;
  r1.style.transform = `scale(${1 + Math.sin(t * 0.5) * 0.04})`;
  r2.style.left = `${W * 0.72 + Math.cos(t * 0.45) * 30}px`; r2.style.top = `${H * (sq ? 0.08 : 0.16) + Math.sin(t * 0.4) * 30}px`;

  // 切り替えの帯
  let wx = 130, wx2 = 130;
  for (const s of plan.scenes) {
    if (s.start === 0) continue;
    const k = (t - (s.start - WIPE)) / (2 * WIPE);
    if (k >= 0 && k <= 1) wx = (1 - 2 * E.inout(k)) * 130;
    const k2 = (t - (s.start - WIPE - 0.06)) / (2 * WIPE);
    if (k2 >= 0 && k2 <= 1) wx2 = (1 - 2 * E.inout(k2)) * 130;
  }
  document.getElementById('wipe1').style.transform = `skewX(-14deg) translateX(${wx}%)`;
  document.getElementById('wipe2').style.transform = `skewX(-14deg) translateX(${wx2}%)`;

  document.querySelectorAll('.scene').forEach((el) => {
    const s = plan.scenes[+el.dataset.i];
    const last = s.end >= plan.duration;
    const on = t >= s.start && (t < s.end || last);
    el.style.display = on ? 'block' : 'none';
    if (!on) return;
    const lt = t - s.start;
    el.querySelectorAll('.a').forEach((a) => animate(a, lt, t));
    const zoom = el.querySelector('.zoom[data-clip]');
    if (zoom && clips[zoom.dataset.clip]) {
      const c = clips[zoom.dataset.clip];
      const [ia, ib] = zoom.querySelectorAll('img');
      if (ia.getAttribute('src') !== c.a) { ia.src = c.a; waits.push(ia.decode().catch(() => {})); }
      if (c.b) { if (ib.getAttribute('src') !== c.b) { ib.src = c.b; waits.push(ib.decode().catch(() => {})); } ib.style.opacity = c.mix; }
      else ib.style.opacity = 0;
    }
  });
  await Promise.all(waits);
  return true;
};
</script>
</body>
