/* 色は withsoegi.jp（css/site.css）に合わせる。光る演出（ぼかし・発光）は使わない */
:root {
  --paper: #E9EEED; --surface: #FFFFFF; --ink: #1B2428; --ink-2: #44525A; --ink-3: #5A676E;
  --line: #D5DDDF; --sunk: #EEF2F1; --accent: #1A6D73; --accent-soft: #DCF0F0; --accent-bright: #3FA3A9;
  --leaf: #2E7652; --leaf-soft: #E2EFE7; --warn-bg: #FFF4C7; --warn-ink: #6B4E00; --warn-line: #E0B400;
  --dx: 0px; --dy: 0px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: var(--paper); overflow: hidden; }
body { font-family: "BIZ UDPGothic", sans-serif; color: var(--ink); font-feature-settings: "palt" 1; -webkit-font-smoothing: antialiased; }
#stage { position: relative; overflow: hidden; background: var(--paper); }
[lang="ko"] { font-family: "Noto Sans KR", sans-serif; }
[lang="zh-Hant"] { font-family: "Noto Sans TC", sans-serif; }
[lang="en"] { font-family: "BIZ UDPGothic", sans-serif; }

/* 背景：ゆっくり流れる点の格子と、大きな輪 */
.bg { position: absolute; inset: 0; }
.dots { position: absolute; inset: -80px; background-image: radial-gradient(rgba(27,36,40,.13) 2.2px, transparent 2.6px); background-size: 44px 44px; background-position: var(--dx) var(--dy); }
.ring { position: absolute; border-radius: 50%; border: 3px solid rgba(26,109,115,.08); }
.blob { position: absolute; border-radius: 50%; background: rgba(220,240,240,.75); }

.scene { position: absolute; inset: 0; display: none; }
.scene.dark { background: var(--ink); color: #fff; }
.scene.dark::before { content: ""; position: absolute; inset: -80px; background-image: radial-gradient(rgba(255,255,255,.09) 2.2px, transparent 2.6px); background-size: 44px 44px; background-position: var(--dx) var(--dy); }
.a { will-change: transform, opacity; }
.em { color: var(--accent); }
.dark .em { color: var(--accent-bright); }

/* 文字：行ごとにマスクから出す */
.big { font-weight: 700; line-height: 1.28; letter-spacing: .01em; }
.ln { display: block; overflow: hidden; padding: 0 .04em .08em; margin-bottom: -.08em; }
.ln > span { display: inline-block; }
.ln.free { overflow: visible; }
.v .sqbr { display: none; }
.mk { position: relative; z-index: 0; }
.mk::before { content: ""; position: absolute; left: -.06em; right: -.06em; bottom: .04em; height: .36em; background: var(--accent-soft); z-index: -1; transform-origin: left center; transform: scaleX(var(--mk, 0)); }
.dark .mk::before { background: rgba(63,163,169,.32); }

.card { background: var(--surface); border-radius: 24px; box-shadow: 0 1px 2px rgba(29,35,39,.06), 0 18px 36px -16px rgba(29,35,39,.24); }
.ico { flex: none; width: 92px; height: 92px; border-radius: 22px; background: var(--accent-soft); display: grid; place-items: center; }
.ico svg { width: 56px; height: 56px; fill: none; stroke: var(--accent); stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }

/* できることの場面：850×780 の絵（正方形の版では縮める） */
.ill { position: absolute; width: 850px; height: 780px; transform-origin: 0 0; }
.ill > * { position: absolute; }
.eff { position: absolute; display: inline-flex; align-items: center; gap: 16px; background: var(--leaf-soft); color: var(--leaf); font-weight: 700; border-radius: 999px; white-space: nowrap; }
.eff svg { width: 1.1em; height: 1.1em; fill: none; stroke: var(--leaf); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
.imgnote { position: absolute; color: var(--ink-3); line-height: 1.3; }
.etag { display: inline-block; background: var(--accent); color: #fff; font-weight: 700; border-radius: 10px; padding: 4px 12px; font-size: 22px; }

/* レシート */
.rcpt { width: 200px; height: 262px; background: #fff; padding: 22px 20px; box-shadow: 0 2px 3px rgba(0,0,0,.08), 0 18px 28px -14px rgba(29,35,39,.35);
  clip-path: polygon(0 0, 100% 0, 100% 96%, 90% 100%, 80% 96%, 70% 100%, 60% 96%, 50% 100%, 40% 96%, 30% 100%, 20% 96%, 10% 100%, 0 96%); }
.rcpt b { display: block; font-size: 24px; text-align: center; margin-bottom: 16px; white-space: nowrap; }
.rcpt i { display: block; height: 10px; border-radius: 5px; background: var(--line); margin: 12px 0; }
.rcpt i.s { width: 60%; }
.rcpt p { margin-top: 18px; border-top: 2px dashed var(--line); padding-top: 12px; font-size: 26px; font-weight: 700; display: flex; justify-content: space-between; }
.scan { left: -10px; width: 690px; height: 6px; border-radius: 3px; background: var(--accent); }
.scanlbl { font-size: 26px; }
.down { width: 0; height: 0; border-left: 26px solid transparent; border-right: 26px solid transparent; border-top: 30px solid var(--ink-3); }
.sheet { left: 0; top: 345px; width: 850px; overflow: hidden; }
.sheet .row { position: relative; display: grid; grid-template-columns: 120px 300px 170px 260px; height: 74px; align-items: center; font-size: 30px; border-top: 1px solid var(--line); z-index: 0; }
.sheet .row > span { padding: 0 18px; white-space: nowrap; }
.sheet .row > span.num { text-align: right; font-variant-numeric: tabular-nums; }
.sheet .head { background: var(--accent-soft); color: var(--accent); font-weight: 700; font-size: 26px; height: 60px; border-top: 0; }
.sheet .xl { position: absolute; right: 18px; top: 14px; }
.rowmk::before { content: ""; position: absolute; inset: 0; background: var(--warn-bg); z-index: -1; transform-origin: left center; transform: scaleX(var(--mk, 0)); }
.warn { display: inline-block; background: var(--warn-line); color: #3d2c00; border-radius: 8px; font-size: 22px; font-weight: 700; padding: 2px 10px; }
.callout { background: var(--ink); color: #fff; font-weight: 700; font-size: 32px; border-radius: 16px; padding: 14px 24px; white-space: nowrap; display: flex; align-items: center; gap: 12px; }
.callout svg { width: 1.2em; height: 1.2em; fill: none; stroke: #fff; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }

/* 資料さがし */
.doc { width: 200px; height: 250px; background: #fff; border-radius: 16px; padding: 20px; box-shadow: 0 2px 3px rgba(0,0,0,.06), 0 18px 28px -14px rgba(29,35,39,.3); }
.doc b { display: block; font-size: 26px; margin-bottom: 14px; }
.doc i { display: block; height: 10px; border-radius: 5px; background: var(--line); margin: 13px 0; }
.doc i.s { width: 55%; }
.q { background: var(--accent-soft); color: var(--ink); font-size: 36px; font-weight: 700; border-radius: 26px 26px 6px 26px; padding: 22px 28px; white-space: nowrap; }
.lens { width: 130px; height: 130px; }
.lens svg { width: 100%; height: 100%; fill: rgba(255,255,255,.35); stroke: var(--ink); stroke-width: 7; stroke-linecap: round; }
.bigdoc { left: 0; top: 375px; width: 850px; padding: 24px 30px; }
.bigdoc .t1 { font-size: 24px; color: var(--ink-3); }
.bigdoc .t2 { font-size: 32px; font-weight: 700; margin: 4px 0 14px; }
.bigdoc .hit { position: relative; display: inline-block; font-size: 32px; padding: 4px 6px; z-index: 0; }
.bigdoc .hit::before { content: ""; position: absolute; inset: 0; background: #FFE58A; z-index: -1; transform-origin: left center; transform: scaleX(var(--mk, 0)); }
.ans { left: 150px; top: 590px; width: 700px; padding: 26px 32px; border: 4px solid var(--accent); border-radius: 26px 26px 26px 6px; background: #fff; }
.ans .t1 { font-size: 44px; font-weight: 700; }
.ans .t2 { font-size: 26px; color: var(--accent); font-weight: 700; margin-top: 8px; display: flex; align-items: center; gap: 10px; }

/* 外国語の問い合わせ */
.msg { width: 560px; padding: 18px 24px; background: #fff; border-radius: 22px; }
.msg .lang { display: inline-block; font-size: 22px; font-weight: 700; color: var(--accent); background: var(--accent-soft); border-radius: 8px; padding: 2px 10px; margin-bottom: 8px; }
.msg p { font-size: 30px; line-height: 1.35; white-space: nowrap; }
.draft { left: 250px; top: 420px; width: 600px; padding: 24px 28px; border: 4px solid var(--accent); }
.draft h4 { font-size: 24px; color: var(--accent); margin-bottom: 10px; }
.draft p { font-size: 30px; line-height: 1.4; min-height: 42px; white-space: nowrap; }

.plane { width: 90px; height: 90px; }
.plane svg { width: 100%; height: 100%; fill: var(--accent); }

/* 進め方 */
.step { position: absolute; display: flex; align-items: center; gap: 34px; }
.n { width: 88px; height: 88px; border-radius: 50%; background: var(--surface); border: 5px solid var(--ink); display: grid; place-items: center; font-size: 46px; font-weight: 700; flex: none; }

.conn { position: absolute; background: var(--accent); transform-origin: 0 0; }
.chk { fill: none; stroke: var(--leaf); stroke-width: 9; stroke-linecap: round; stroke-linejoin: round; }

/* 日本地図 */
.jp path { fill: #DCE4E3; stroke: #fff; stroke-width: 1.4; vector-effect: non-scaling-stroke; }
.jp path.home { fill: var(--accent); }
.jp rect { fill: none; stroke: var(--ink-3); stroke-width: 1.5; vector-effect: non-scaling-stroke; }
.dark .jp path { fill: rgba(255,255,255,.16); stroke: var(--ink); }
.dark .jp path.home { fill: var(--accent-bright); }
.wave { position: absolute; width: 120px; height: 120px; margin: -60px 0 0 -60px; border-radius: 50%; border: 4px solid var(--accent); opacity: 0; }
.thumb .jp path:not(.home) { fill: #C6D4D3; }
.thring { position: absolute; border-radius: 50%; border: 5px solid var(--accent); }
.dark .thring { border-color: var(--accent-bright); }
.homedot { position: absolute; width: 30px; height: 30px; margin: -15px 0 0 -15px; border-radius: 50%; background: #fff; border: 7px solid var(--accent); }
.homelbl { position: absolute; background: var(--ink); color: #fff; font-weight: 700; border-radius: 12px; padding: 8px 16px; white-space: nowrap; }

.wordmark { background: var(--ink); -webkit-mask: var(--wm) left center / contain no-repeat; mask: var(--wm) left center / contain no-repeat; }
.btn { position: relative; display: inline-flex; align-items: center; justify-content: center; background: var(--accent); color: #fff; font-weight: 700; border-radius: 999px; }
.pulse { position: absolute; inset: 0; border-radius: 999px; border: 4px solid var(--accent); opacity: 0; }
.ptr { position: absolute; width: 64px; height: 64px; border-radius: 50%; background: rgba(27,36,40,.82); border: 5px solid #fff; opacity: 0; }
.url { font-weight: 700; letter-spacing: .01em; white-space: nowrap; }
.caret { display: inline-block; width: .08em; height: .9em; background: var(--accent); vertical-align: -.08em; margin-left: .04em; }
.clock { font-weight: 700; letter-spacing: .04em; font-variant-numeric: tabular-nums; color: rgba(255,255,255,.92); }
.clock .colon { color: var(--accent-bright); }
.clock small { display: block; font-size: .22em; letter-spacing: .1em; color: rgba(255,255,255,.62); font-weight: 400; margin-bottom: .2em; }

/* 場面の切り替え：斜めの帯が横切る */

.sq .japan .sub { position: absolute; left: 0; right: 0; top: 810px; font-size: 42px; font-weight: 700; }
.sq .japan .rep { position: absolute; left: 0; right: 0; top: 885px; font-size: 32px; color: var(--ink-2); }
.sq .japan .homelbl { font-size: 26px; }
.sq .s7 .wordmark { position: absolute; left: 210px; top: 190px; width: 660px; height: 110px; -webkit-mask-position: center; mask-position: center; }
.sq .s7 .tag { position: absolute; left: 0; right: 0; top: 350px; font-size: 46px; color: var(--ink-2); }
.sq .s7 .btnwrap { position: absolute; left: 0; right: 0; top: 480px; }
.sq .s7 .btn { height: 128px; padding: 0 48px; font-size: 52px; }
.sq .s7 .url { position: absolute; left: 0; right: 0; top: 690px; font-size: 104px; }
.sq .thumb .big { position: absolute; left: 72px; right: 0; top: 110px; font-size: 88px; text-align: left; }
.sq .thumb .sub { position: absolute; left: 72px; top: 370px; font-size: 48px; font-weight: 700; color: var(--accent); text-align: left; }
.sq .thumb .wordmark { position: absolute; left: 72px; top: 470px; width: 480px; height: 80px; }
.sq .thumb .jp { position: absolute; left: 600px; top: 470px; height: 640px; }
</style>
</head>
<body>
<div id="stage"></div>
<script>
// 場面の部品。文字は brand（brand.json）と、この中の決まった文だけ。データはすべて架空（サイトの見本と同じ店・会社）。
// 動かす要素は class="a" と data-fx（動き方）・data-in（場面の始まりから何秒）・data-dur（何秒かけて）。
// data-sfx を付けた要素は、出る時刻に効果音を鳴らす（setup() が一覧にして返す）。
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const IMGNOTE = '※イメージです。データは架空です';
const ICONS = {
  doc: '<svg viewBox="0 0 48 48"><path class="a" data-fx="draw" data-dur="0.6" pathLength="1" d="M12 5h17l8 8v30H12z M29 5v8h8 M18 22h13 M18 29h13 M18 36h8"/></svg>',
  search: '<svg viewBox="0 0 48 48"><path class="a" data-fx="draw" data-dur="0.6" pathLength="1" d="M21 7a14 14 0 1 1 0 28a14 14 0 1 1 0-28z M31 31l10 10"/></svg>',
  chat: '<svg viewBox="0 0 48 48"><path class="a" data-fx="draw" data-dur="0.6" pathLength="1" d="M6 9h24v16H16l-6 5v-5H6z M34 17h8v16h-4v5l-6-5H20v-4"/></svg>',
  chk: '<svg viewBox="0 0 48 48"><path class="a" data-fx="draw" data-dur="0.6" pathLength="1" d="M24 7a17 17 0 1 1 0 34a17 17 0 1 1 0-34z M16 24l6 6 11-12"/></svg>',
  person: '<svg viewBox="0 0 48 48"><path class="a" data-fx="draw" data-dur="0.6" pathLength="1" d="M24 8a8 8 0 1 1 0 16a8 8 0 1 1 0-16z M9 42c2-8 8-12 15-12s13 4 15 12"/></svg>',
};
const DOWN = '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 7v10M7.5 12.5L12 17l4.5-4.5"/></svg>';
const PERSON = '<svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>';
const CHECK = '<svg viewBox="0 0 24 24"><path d="M4 12.5l5 5L20 6.5"/></svg>';
const lines = (arr, t0, step = 0.12, sfx = '') => arr.map((l, i) => `<span class="ln"><span class="a" data-fx="line" data-in="${(t0 + i * step).toFixed(2)}"${i === 0 && sfx ? ` data-sfx="${sfx}"` : ''}>${l}</span></span>`).join('');

// 「できること」の場面。T(x)：4.5秒の場面で設計した時刻を、場面の長さに合わせて縮める
function feat(head, ill, eff, opt) {
  const k = Math.min(1, opt.dur / 4.5);
  const T = (x) => (x * k).toFixed(2);
  return `<div class="big">${lines(head, 0.1)}</div>
    <div class="ill">${ill(T)}</div>
    <div class="eff a" data-fx="effpop" data-in="${T(2.9)}" data-dur="0.5" data-sfx="check">${DOWN}${eff}</div>
    <p class="imgnote a" data-fx="fade" data-in="0.4">${IMGNOTE}</p>`;
}

const SCENES = {
  s1: () => `<div class="clock a" data-fx="clock" data-in="0.0" data-dur="1.35" data-from="18:00" data-to="22:47" data-sfx="ticks"><small>月末の夜</small><span class="v">18<span class="colon">:</span>00</span></div>
    <div class="big">${lines(['月末、また'], 0.2)}<span class="ln free"><span class="a" data-fx="slam" data-in="0.62" data-dur="0.5" data-sfx="slam"><span class="em">夜まで</span>事務作業？</span></span></div>`,
  s2: (f, b, opt) => {
    const o = opt.dur - 0.45;
    return `<h2>${lines(['こんな手間、ありませんか'], 0.05)}</h2>
    <div class="card c1 a" data-fx="pop" data-in="0.4" data-out="${o.toFixed(2)}" data-sfx="pop"><span class="ico">${ICONS.doc}</span>レシートの入力</div>
    <div class="card c2 a" data-fx="pop" data-in="1.1" data-out="${(o + 0.07).toFixed(2)}" data-sfx="pop"><span class="ico">${ICONS.search}</span>社内の資料さがし</div>
    <div class="card c3 a" data-fx="pop" data-in="1.8" data-out="${(o + 0.14).toFixed(2)}" data-sfx="pop"><span class="ico">${ICONS.chat}</span>外国語の問い合わせ</div>`;
  },
  // レシート → Excel：読み取り → 表に1行ずつ → 1行は要確認（人が確かめる）
  receipt: (f, b, opt) => feat(['レシートの写真から、', '<span class="mk a" data-fx="mark" data-in="0.8">Excelの表</span>へ。'], (T) => {
    const rc = [['さくら文具店', '1,980', -5, 10], ['みどり食堂', '1,760', 3, 225], ['山の駅 売店', '1,200', -2, 440]];
    const rows = [['11/04', 'さくら文具店', '1,980', '事務用品費'], ['11/06', 'みどり食堂', '1,760', '会議費'], ['11/09', 'あおぞらGS', '6,200', '車両費'], ['11/12', '山の駅 売店', '1,200', '']];
    return rc.map(([n, v, r, x], i) => `<div class="rcpt a" data-fx="move" data-from="-420,40" data-in="${T(0.15 + i * 0.15)}" data-dur="${T(0.6)}" ${i === 0 ? 'data-sfx="rise"' : ''} style="left:${x}px;top:${i === 1 ? 22 : 8}px;rotate:${r}deg"><b>${n}</b><i></i><i class="s"></i><i></i><p><span>計</span><span>¥${v}</span></p></div>`).join('')
      + `<div class="scan a" data-fx="scan" data-y0="0" data-y1="285" data-in="${T(0.85)}" data-dur="${T(0.7)}" data-sfx="scan"></div>
      <div class="callout scanlbl a" data-fx="pop" data-in="${T(0.9)}" data-dur="0.4" data-out="${T(1.75)}" style="left:690px;top:120px">読み取り</div>
      <div class="down a" data-fx="fade" data-in="${T(1.3)}" style="left:300px;top:300px"></div>
      <div class="sheet card a" data-fx="rise" data-in="${T(1.25)}" data-dur="${T(0.5)}">
        <div class="row head"><span>日付</span><span>支払先</span><span class="num">金額</span><span>科目（候補）</span></div>
        ${rows.map((r, i) => `<div class="row ${i === 3 ? 'rowmk a' : ''}" ${i === 3 ? `data-fx="mark" data-in="${T(2.65)}"` : ''}>${r.map((c, j) => `<span class="${j === 2 ? 'num ' : ''}a" data-fx="type" data-nocaret="1" data-text="${c}" data-in="${T(1.6 + i * 0.27)}" data-dur="${T(0.25)}" ${j === 0 ? 'data-sfx="tick"' : ''}></span>`).join('')}</div>`).join('')}
      </div>
      <span class="warn a" data-fx="pop" data-in="${T(2.75)}" data-dur="0.4" style="left:640px;top:${345 + 60 + 74 * 3 + 22}px">要確認</span>
      <div class="callout a" data-fx="pop" data-in="${T(3.0)}" data-dur="0.45" data-sfx="pop" style="left:430px;top:${345 + 60 + 74 * 4 + 22}px">${PERSON}最後は人が確認</div>`;
  }, '入力の手間を減らす', opt),
  // 社内の資料さがし：質問 → 資料を探す → 見積書の行に印 → 根拠付きの答え
  search: (f, b, opt) => feat(['社内の資料から、', '<span class="mk a" data-fx="mark" data-in="0.8">根拠付き</span>で答える。'], (T) => {
    const docs = [['手順書', -4, 0], ['就業規則', 3, 150], ['見積書', -2, 300]];
    return docs.map(([n, r, x], i) => `<div class="doc a" data-fx="move" data-from="-380,30" data-in="${T(0.1 + i * 0.12)}" data-dur="${T(0.55)}" ${i === 0 ? 'data-sfx="rise"' : ''} style="left:${x}px;top:${95 + (i % 2) * 12}px;rotate:${r}deg"><b>${n}</b><i></i><i class="s"></i><i></i><i></i><i class="s"></i></div>`).join('')
      + `<div class="q a" data-fx="pop" data-in="${T(0.45)}" data-dur="0.45" data-sfx="pop" style="left:330px;top:-10px">去年のジャムの単価は？</div>
      <div class="lens a" data-fx="path" data-path="20,150;170,130;330,160;380,150" data-in="${T(0.85)}" data-dur="${T(0.9)}" data-sfx="scan" style="left:0;top:0"><svg viewBox="0 0 60 60"><circle cx="25" cy="25" r="17"/><path d="M38 38l15 15"/></svg></div>
      <div class="bigdoc card a" data-fx="rise" data-in="${T(1.75)}" data-dur="${T(0.5)}"><p class="t1">過去の見積書</p><p class="t2">見積書 No.2025-031（やまびこスーパー（仮））</p><span class="hit a" data-fx="mark" data-in="${T(2.1)}">ラ・フランスジャム 150g｜単価 420円</span></div>
      <div class="ans a" data-fx="pop" data-in="${T(2.45)}" data-dur="0.5" data-sfx="pop"><p class="t1">420円（税抜）です。</p><p class="t2"><span class="etag">根拠</span>見積書 No.2025-031 の1行目</p></div>`;
  }, '探す時間を短く', opt),
  // 外国語の問い合わせ：3つの言語の問い合わせ → 返信の下書き → スタッフが確認 → 送る
  inquiry: (f, b, opt) => feat(['外国語の問い合わせに、', '<span class="mk a" data-fx="mark" data-in="0.8">返信の下書き</span>。'], (T) => {
    const msgs = [['英語', 'en', 'Do you have a pick-up service?'], ['繁体字（台湾）', 'zh-Hant', '晚餐可以對應雞蛋過敏嗎？'], ['韓国語', 'ko', '가족탕은 예약이 필요한가요?']];
    return msgs.map(([l, lang, t], i) => `<div class="msg card a" data-fx="move" data-from="-300,0" data-in="${T(0.15 + i * 0.25)}" data-dur="${T(0.55)}" ${i === 0 ? 'data-sfx="pop"' : ''} style="left:0;top:${i * 134}px"><span class="lang">${l}</span><p lang="${lang}">${t}</p></div>`).join('')
      + `<div class="draft card a" data-fx="rise" data-in="${T(1.05)}" data-dur="${T(0.45)}">
        <h4>返信の下書き（英語）</h4>
        <p lang="en" class="a" data-fx="type" data-nocaret="1" data-text="Thank you for your inquiry." data-in="${T(1.35)}" data-dur="${T(0.55)}" data-sfx="type"></p>
        <p lang="en" class="a" data-fx="type" data-nocaret="1" data-text="We offer a free pick-up from" data-in="${T(1.85)}" data-dur="${T(0.55)}"></p>
        <p class="ja a" data-fx="fade" data-in="${T(2.3)}">日本語訳つき：中身をその場で確かめられる</p>
      </div>
      <div class="callout a" data-fx="pop" data-in="${T(2.55)}" data-dur="0.45" data-sfx="stamp" style="left:250px;top:690px">${CHECK}スタッフが確認して送る</div>
      <div class="plane a" data-fx="fly" data-in="${T(3.0)}" data-dur="${T(0.8)}" data-sfx="send" style="left:740px;top:690px"><svg viewBox="0 0 24 24"><path d="M2 11l20-9-7 20-3-8z"/></svg></div>`;
  }, '返信までの時間を短く', opt),
  s5: (f, b, opt) => `<div class="big">${lines(['削減できた時間を、', '<span class="mk a" data-fx="mark" data-in="0.7">数字で確かめて</span>から。'], 0.05)}</div>
    <div class="conn a" data-fx="grow" data-in="0.45" data-dur="1.5"></div>
    <div class="step st1 a" data-fx="pop" data-in="0.3" data-sfx="pop"><span class="n">1</span><span class="t">無料相談<small>60分</small></span></div>
    <div class="stamp a" data-fx="stamp" data-in="0.65" data-dur="0.4" data-sfx="stamp">無料</div>
    <div class="step st2 a" data-fx="pop" data-in="0.95" data-sfx="pop"><span class="n">2</span><span class="t">お試し1ヶ月<small>5万円（税抜）</small></span></div>
    <div class="step st3 a" data-fx="pop" data-in="1.6" data-sfx="pop"><span class="n">3</span><span class="t">数字を見て、<br class="sqbr">決める</span></div>
    <svg class="chkw" viewBox="0 0 60 60"><path class="chk a" data-fx="draw" data-in="2.0" data-dur="0.4" data-sfx="check" pathLength="1" d="M12 31l12 12 24-26"/></svg>`,
  // 山形を中心に、全国へ：山形が光り（色が付き）、波が広がって全国の県に順に色が付く。実績に見えないよう、都市の点や線は描かない
  japan: (f, b, opt) => {
    const j = b.japan; const [, , vw, vh] = j.viewBox.split(' ').map(Number);
    const ok = j.okinawaBox;
    return `<div class="big">${lines(['山形を中心に、', '<span class="mk a" data-fx="mark" data-in="0.6">全国の企業</span>をご支援します'], 0.05)}</div>
    <svg class="jp map" viewBox="${j.viewBox}">${j.prefs.map((p) => `<path class="a ${p.name === 'Yamagata' ? 'home' : ''}" data-fx="${p.name === 'Yamagata' ? 'homepop' : 'wavefill'}" data-dist="${p.dist}" data-in="${p.name === 'Yamagata' ? 0.25 : 0.55}" d="${p.d}"/>`).join('')}
      <rect class="a" data-fx="fade" data-in="0.2" x="${ok[0]}" y="${ok[1]}" width="${ok[2] - ok[0]}" height="${ok[3] - ok[1]}"/></svg>
    ${[0, 0.45, 0.9].map((d, i) => `<div class="wave a" data-fx="ring" data-in="${(0.55 + d).toFixed(2)}" data-dur="1.4" data-pin="${(j.yamagata[0] / vw).toFixed(4)},${(j.yamagata[1] / vh).toFixed(4)}" ${i === 0 ? 'data-sfx="wave"' : ''}></div>`).join('')}
    <div class="homedot a" data-fx="pop" data-in="0.3" data-dur="0.4" data-sfx="drop" data-pin="${(j.yamagata[0] / vw).toFixed(4)},${(j.yamagata[1] / vh).toFixed(4)}"></div>
    <div class="homelbl a" data-fx="pop" data-in="0.45" data-dur="0.4" data-pin="${(j.yamagata[0] / vw).toFixed(4)},${(j.yamagata[1] / vh).toFixed(4)}" data-off="-170,-95">山形</div>
    <p class="sub a" data-fx="rise" data-in="1.2">県内は訪問、県外はオンライン</p>
    <p class="rep a" data-fx="rise" data-in="1.45">${esc(b.rep)}</p>`;
  },
  s7: (f, b, opt = {}) => {
    const o = opt.lead ? 0.4 : 0;
    return `${opt.lead ? `<p class="lead">${lines([esc(opt.lead)], 0.08)}</p>` : ''}
    ${b.wordmarkUrl ? `<div class="wordmark a" data-fx="wipe" data-in="${0.05 + o}" data-dur="0.6" role="img" aria-label="${esc(b.name)}"></div>` : `<div class="big a" data-fx="rise" data-in="${0.05 + o}">${esc(b.name)}</div>`}
    <p class="tag a" data-fx="rise" data-in="${0.3 + o}">${esc(b.tagline)}</p>
    <div class="btnwrap"><span class="btn a" data-fx="btn" data-in="${0.55 + o}" data-dur="0.45" data-press="${1.85 + o * 1.6}" data-sfx="pop"><span class="pulse a" data-fx="pulse" data-in="${2.0 + o * 1.6}"></span>まずは無料相談（60分）から<span class="ptr a" data-fx="ptr" data-in="${1.45 + o * 1.6}" data-press="${1.85 + o * 1.6}" data-sfx="click" data-sfxoff="0.4"></span></span></div>
    <p class="url a" data-fx="type" data-in="${0.95 + o * 1.2}" data-dur="0.55" data-text="${esc(b.url)}" data-sfx="type"></p>`;
  },

  // ---- Instagram 初日の動画（文言は render.mjs の opt から受け取る） ----
  darkhook: (f, b, o) => `<div class="big">${o.lines.map((l, i) => `<span class="ln free"><span class="a" data-fx="slam" data-in="${(0.15 + i * 0.35).toFixed(2)}" data-dur="0.5" ${i === 0 ? 'data-sfx="slam"' : ''}>${l}</span></span>`).join('')}</div>
    ${o.who ? `<p class="who a" data-fx="rise" data-in="${0.5 + o.lines.length * 0.35}">${o.who}</p>` : ''}
    ${o.logo && b.wordmarkUrl ? `<div class="wordmark a" data-fx="wipe" data-in="${0.8 + o.lines.length * 0.35}" data-dur="0.6" style="position:absolute;left:80px;top:1110px;width:560px;height:92px;background:#fff"></div>` : ''}`,
  career: (f, b, o) => {
    const j = b.japan; const P = (n) => j.prefs.find((p) => p.name === n).c;
    const [yx, yy] = P('Yamagata'); const [tx, ty] = P('Tokyo');
    const vx = 430, vy = 330, vw = 440, vh = 500; // 東北・関東のあたり
    return `<div class="big">${lines(o.head, 0.05)}</div>
    <svg class="jp map a" data-fx="fade" data-in="0.1" viewBox="${vx} ${vy} ${vw} ${vh}">${j.prefs.map((p) => `<path class="${p.name === 'Yamagata' ? 'home' : ''}" d="${p.d}"/>`).join('')}
      <path class="arc a" data-fx="draw" data-in="0.6" data-dur="0.6" data-sfx="draw" pathLength="1" d="M${yx} ${yy} Q${yx + 150} ${(yy + ty) / 2} ${tx} ${ty}"/>
      <path class="arc a" data-fx="draw" data-in="1.75" data-dur="0.6" data-sfx="draw" pathLength="1" d="M${tx} ${ty} Q${tx - 170} ${(yy + ty) / 2} ${yx} ${yy}"/>
      <circle class="pt a" data-fx="pop2" data-in="0.3" cx="${yx}" cy="${yy}" r="7"/><circle class="pt a" data-fx="pop2" data-in="1.2" cx="${tx}" cy="${ty}" r="7"/></svg>
    <div class="lbl a" data-fx="pop" data-in="0.35" data-dur="0.4" data-pin="${((yx - vx) / vw).toFixed(4)},${((yy - vy) / vh).toFixed(4)}" data-off="-150,-70">山形</div>
    <div class="lbl a" data-fx="pop" data-in="1.25" data-dur="0.4" data-pin="${((tx - vx) / vw).toFixed(4)},${((ty - vy) / vh).toFixed(4)}" data-off="34,-24">東京</div>
    <div class="items">${o.items.map((t, i) => `<p class="a ${i === o.items.length - 1 ? 'now' : ''}" data-fx="pop" data-in="${[0.3, 1.3, 2.4][i]}" ${i < o.items.length - 1 ? `data-out="${[1.05, 2.15][i]}"` : ''} ${i === 0 ? 'data-sfx="pop"' : ''}><i></i>${t}</p>`).join('')}</div>`;
  },
  cards: (f, b, o) => `<div class="big">${lines(o.head, 0.05)}</div>
    ${o.items.map((t, i) => `<div class="card c${i + 1} a" data-fx="pop" data-in="${(0.45 + i * 0.75).toFixed(2)}" data-sfx="pop"><span class="ico">${ICONS[o.icons[i]]}</span>${t}</div>`).join('')}`,
  pricestep: (f, b, o) => `<p class="lbl">${lines([o.label], 0.05)}</p>
    ${o.main ? `<div class="main">${lines(o.main, 0.35, 0.15, 'check')}</div>`
      : `<p class="num a" data-fx="slam" data-in="0.35" data-dur="0.5" data-sfx="stamp">${o.big}${o.small ? `<small>${o.small}</small>` : ''}</p>`}
    <p class="sub a" data-fx="rise" data-in="0.85" style="${o.main ? 'top:1000px' : ''}">${o.sub.join('<br>')}</p>
    ${o.note ? `<p class="note a" data-fx="rise" data-in="1.25">${o.note.join('<br>')}</p>` : ''}`,
  igcta: (f, b, o) => `<div class="big">${lines(o.head, 0.05)}</div>
    <p class="sub a" data-fx="rise" data-in="0.35">${o.sub}</p>
    ${b.wordmarkUrl ? `<div class="wordmark a" data-fx="wipe" data-in="0.6" data-dur="0.6" role="img" aria-label="${esc(b.name)}"></div>` : ''}
    <div class="btnwrap"><span class="btn a" data-fx="btn" data-in="0.95" data-dur="0.45" data-press="2.05" data-sfx="pop"><span class="pulse a" data-fx="pulse" data-in="2.2"></span>${o.btn}<span class="ptr a" data-fx="ptr" data-in="1.65" data-press="2.05" data-sfx="click" data-sfxoff="0.4"></span></span></div>
    <p class="url a" data-fx="rise" data-in="1.2">${o.foot}</p>`,
  thumb: (f, b, opt = {}) => {
    const j = b.japan;
    return `<div class="big" style="${opt.size ? `font-size:${opt.size}px` : ''}">${opt.title ? opt.title : opt.hook ? '月末、また<br><span class="em">夜まで</span>事務作業？' : '事務の手間を、<br><span class="em">ITで</span>減らすお手伝い'}</div>
    <p class="sub">${opt.sub || '県内は訪問・県外はオンライン'}</p>
    ${b.wordmarkUrl ? `<div class="wordmark" role="img" aria-label="${esc(b.name)}"></div>` : `<p class="sub">${esc(b.name)}</p>`}
    ${opt.prices ? `<div class="prices">${opt.prices.map(([l, v]) => `<p><span>${l}</span><b>${v}</b></p>`).join('')}</div>` : ''}
    <svg class="jp map" style="${opt.prices ? 'display:none' : ''}" viewBox="${j.viewBox}">${j.prefs.map((p) => `<path class="${p.name === 'Yamagata' ? 'home' : ''}" d="${p.d}"/>`).join('')}</svg>
    ${[[150, 0.6], [300, 0.35], [480, 0.18]].map(([w, o]) => `<div class="thring" data-pin="${(j.yamagata[0] / +j.viewBox.split(' ')[2]).toFixed(4)},${(j.yamagata[1] / +j.viewBox.split(' ')[3]).toFixed(4)}" style="width:${w}px;height:${w}px;margin:${-w / 2}px 0 0 ${-w / 2}px;opacity:${o};${opt.prices ? 'display:none' : ''}"></div>`).join('')}`;
  },
};
const FEAT = new Set(['receipt', 'search', 'inquiry']);
const DARK = new Set(['s1', 'darkhook']);

let plan = null;
const clamp = (x) => Math.max(0, Math.min(1, x));
const E = {
  expo: (k) => (k >= 1 ? 1 : 1 - Math.pow(2, -10 * k)),
  cubic: (k) => 1 - Math.pow(1 - k, 3),
  back: (k) => { const c1 = 2.0, c3 = c1 + 1; return 1 + c3 * Math.pow(k - 1, 3) + c1 * Math.pow(k - 1, 2); },
  inout: (k) => (k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2),
};
const WIPE = 0.34; // 切り替えの帯が横切る時間の半分
const mixc = (a, b, k) => `rgb(${a.map((v, i) => Math.round(v + (b[i] - v) * k)).join(',')})`;

window.setup = async (p) => {
  plan = p;
  document.body.className = p.format === 'sq' ? 'sq' : 'v';
  const b = p.brand;
  if (b.wordmarkUrl) document.documentElement.style.setProperty('--wm', `url("${b.wordmarkUrl}")`);
  const stage = document.getElementById('stage');
  const sq = p.format === 'sq';
  stage.innerHTML = `<div class="bg"><div class="dots"></div>
      <div class="blob" id="blob1" style="width:${sq ? 620 : 900}px;height:${sq ? 620 : 900}px"></div>
      <div class="ring" id="ring1" style="width:${sq ? 760 : 1100}px;height:${sq ? 760 : 1100}px"></div>
      <div class="ring" id="ring2" style="width:${sq ? 300 : 420}px;height:${sq ? 300 : 420}px"></div></div>`
    + p.scenes.map((s, i) => {
      const dur = s.end - s.start;
      const cls = `scene ${s.id} ${FEAT.has(s.id) ? 'feat' : ''} ${DARK.has(s.id) || s.opt?.dark ? 'dark' : ''} ${s.opt?.lead ? 'withlead' : ''}`;
      return `<section class="${cls}" data-i="${i}">${SCENES[s.id](p.format, b, { ...(s.opt || {}), dur })}</section>`;
    }).join('')
    + '<div class="wipe w2" id="wipe2"></div><div class="wipe w1" id="wipe1"></div>';
  // 測るあいだと、書体を読み込むあいだだけ、すべての場面を表示する
  document.querySelectorAll('.scene').forEach((el) => { el.style.display = 'block'; });
  await Promise.all([document.fonts.load('700 30px "Noto Sans KR"', '가족탕은 예약이 필요한가요?'), document.fonts.load('700 30px "Noto Sans TC"', '晚餐可以對應雞蛋過敏嗎？')]);
  await document.fonts.ready;
  // 地図の上の印の位置（地図の中の割合 → 画面の座標）
  document.querySelectorAll('[data-pin]').forEach((el) => {
    const svg = el.parentElement.querySelector('svg.map');
    const r = svg.getBoundingClientRect(); const st = stage.getBoundingClientRect();
    const [px, py] = el.dataset.pin.split(',').map(Number);
    const [ox, oy] = (el.dataset.off || '0,0').split(',').map(Number);
    el.style.left = `${r.left - st.left + r.width * px + ox}px`; el.style.top = `${r.top - st.top + r.height * py + oy}px`;
  });
  // 効果の札は、正方形では中央に置く
  if (sq) document.querySelectorAll('.eff').forEach((el) => { el.style.marginLeft = `${-el.offsetWidth / 2}px`; });
  document.querySelectorAll('.scene').forEach((el) => { el.style.display = 'none'; });
  // 効果音の一覧
  const cues = [];
  document.querySelectorAll('.scene').forEach((el) => {
    const s = p.scenes[+el.dataset.i];
    el.querySelectorAll('[data-sfx]').forEach((a) => cues.push({ t: +(s.start + +(a.dataset.in || 0) + +(a.dataset.sfxoff || 0)).toFixed(3), sfx: a.dataset.sfx, scene: s.id }));
    if (s.start > 0) cues.push({ t: +(s.start - 0.3).toFixed(3), sfx: 'whoosh', scene: s.id });
  });
  return cues.sort((x, y) => x.t - y.t);
};

function animate(a, lt, t) {
  const t0 = +(a.dataset.in || 0); const dur = +(a.dataset.dur || 0.55);
  const k = clamp((lt - t0) / dur);
  const fx = a.dataset.fx || 'rise';
  let exit = 0;
  if (a.dataset.out) exit = E.inout(clamp((lt - +a.dataset.out) / 0.3));
  switch (fx) {
    case 'line': a.style.transform = `translateY(${(1 - E.expo(k)) * 110}%)`; break;
    case 'rise': { const e = E.expo(k); a.style.opacity = e; a.style.transform = `translateY(${(1 - e) * 50}px)`; break; }
    case 'fade': a.style.opacity = E.cubic(k); break;
    case 'mark': a.style.setProperty('--mk', E.expo(clamp((lt - t0) / 0.5))); break;
    case 'pop': {
      const e = E.back(k); const o = clamp(k * 3);
      a.style.opacity = o * (1 - exit);
      a.style.transform = `translateX(${-exit * 140}px) translateY(${(1 - E.expo(k)) * 60}px) scale(${0.82 + 0.18 * e})`;
      break;
    }
    case 'effpop': { const e = E.back(k); a.style.opacity = clamp(k * 3); a.style.transform = `scale(${0.6 + 0.4 * e})`; a.style.transformOrigin = plan.format === 'sq' ? '50% 50%' : '0 50%'; break; }
    case 'move': {
      const [fx0, fy0] = a.dataset.from.split(',').map(Number); const e = E.expo(k);
      a.style.opacity = clamp(k * 3); a.style.transform = `translate(${(1 - e) * fx0}px, ${(1 - e) * fy0}px)`; break;
    }
    case 'scan': {
      const y = +a.dataset.y0 + (+a.dataset.y1 - +a.dataset.y0) * E.inout(k);
      a.style.opacity = lt < t0 ? 0 : Math.min(1, Math.sin(Math.PI * k) * 3); a.style.transform = `translateY(${y}px)`; break;
    }
    case 'path': {
      const pts = a.dataset.path.split(';').map((p) => p.split(',').map(Number));
      const e = E.inout(k) * (pts.length - 1); const i = Math.min(pts.length - 2, Math.floor(e)); const f = e - i;
      const x = pts[i][0] + (pts[i + 1][0] - pts[i][0]) * f; const y = pts[i][1] + (pts[i + 1][1] - pts[i][1]) * f;
      a.style.opacity = lt < t0 ? 0 : (k < 1 ? 1 : Math.max(0, 1 - (lt - t0 - dur) / 0.25));
      a.style.transform = `translate(${x}px, ${y}px)`; break;
    }
    case 'fly': {
      const e = E.inout(k);
      a.style.opacity = lt < t0 ? 0 : (k < 0.15 ? k / 0.15 : 1 - Math.max(0, (k - 0.7) / 0.3));
      a.style.transform = `translate(${e * 160}px, ${-e * 520}px) rotate(${-e * 12}deg) scale(${1 - e * 0.4})`; break;
    }
    case 'slam': {
      const e = E.back(k); a.style.opacity = clamp(k * 4);
      a.style.transform = `scale(${1.5 - 0.5 * e})`; a.style.transformOrigin = '0 70%';
      break;
    }
    case 'draw': a.style.strokeDasharray = '1'; a.style.strokeDashoffset = String(1 - E.inout(k)); break;
    case 'grow': {
      const e = E.inout(k); const sq = plan.format === 'sq';
      a.style.transform = sq ? `scaleX(${e})` : `scaleY(${e})`; break;
    }
    case 'stamp': { const e = E.back(k); a.style.opacity = clamp(k * 3); a.style.transform = `rotate(${-28 + 16 * e}deg) scale(${1.8 - 0.8 * e})`; break; }
    case 'pop2': { const e = E.back(clamp((lt - t0) / 0.4)); a.style.transformBox = 'fill-box'; a.style.transformOrigin = '50% 50%'; a.style.transform = `scale(${lt < t0 ? 0.001 : e})`; break; }
    case 'homepop': {
      const e = E.back(clamp((lt - t0) / 0.5)); a.style.transformBox = 'fill-box'; a.style.transformOrigin = '50% 50%';
      a.style.transform = `scale(${lt < t0 ? 0.001 : 0.5 + 0.5 * e})`; break;
    }
    case 'wavefill': {
      // 山形から近い県ほど早く色が付く。付いた直後だけ少し濃くして、波が通ったように見せる
      const base = [220, 228, 227], hit = [120, 190, 195], rest = [196, 226, 226];
      const st = t0 + (+a.dataset.dist) * 1.3; const w = clamp((lt - st) / 0.25); const back = clamp((lt - st - 0.25) / 0.6);
      const dark = a.closest('.dark');
      if (dark) break;
      a.style.fill = back > 0 ? mixc(hit, rest, E.cubic(back)) : mixc(base, hit, w); break;
    }
    case 'ring': { const n = lt < t0 ? -1 : ((lt - t0) % dur) / dur; a.style.opacity = n < 0 ? 0 : (1 - n) * 0.85; a.style.transform = `scale(${1 + n * 5})`; break; }
    case 'wipe': { const e = E.expo(k); a.style.clipPath = `inset(0 ${(1 - e) * 100}% 0 0)`; break; }
    case 'btn': {
      const e = E.back(k); const press = +a.dataset.press; const pk = clamp((lt - press) / 0.22);
      const ps = lt >= press ? 1 - 0.07 * Math.sin(Math.PI * pk) : 1;
      a.style.opacity = clamp(k * 3); a.style.transform = `scale(${(0.6 + 0.4 * e) * ps})`; break;
    }
    case 'pulse': { const n = lt < t0 ? -1 : ((lt - t0) % 0.9) / 0.9; a.style.opacity = n < 0 ? 0 : (1 - n) * 0.8; a.style.transform = `scale(${1 + n * 0.22}, ${1 + n * 0.5})`; break; }
    case 'ptr': {
      const press = +a.dataset.press; const e = E.expo(k);
      const pk = clamp((lt - press) / 0.2); const sc = lt >= press ? 1 - 0.25 * Math.sin(Math.PI * pk) : 1;
      a.style.opacity = clamp(k * 3);
      a.style.right = '-46px'; a.style.bottom = '-62px';
      a.style.transform = `translate(${(1 - e) * 200}px, ${(1 - e) * 160}px) scale(${sc})`; break;
    }
    case 'type': {
      const text = a.dataset.text; const n = Math.round(text.length * clamp((lt - t0) / dur));
      if (a.dataset.nocaret) { const v = text.slice(0, n); if (a.textContent !== v) a.textContent = v; break; }
      const blink = lt < t0 ? 0 : (lt - t0 < dur + 0.2 ? 1 : (Math.floor((lt - t0) * 2.2) % 2 ? 0 : 1));
      a.innerHTML = esc(text.slice(0, n)) + `<span class="caret" style="opacity:${blink}"></span>`;
      break;
    }
    case 'clock': {
      const [h0, m0] = a.dataset.from.split(':').map(Number); const [h1, m1] = a.dataset.to.split(':').map(Number);
      const mm = Math.round(h0 * 60 + m0 + (h1 * 60 + m1 - h0 * 60 - m0) * E.cubic(k));
      const v = a.querySelector('.v');
      v.innerHTML = `${String(Math.floor(mm / 60)).padStart(2, '0')}<span class="colon">:</span>${String(mm % 60).padStart(2, '0')}`;
      a.style.opacity = clamp((lt + 0.05) / 0.25);
      a.style.transform = `translateY(${(1 - E.expo(clamp((lt + 0.05) / 0.6))) * 40}px)`;
      break;
    }
  }
}

// t 秒の画面にする
window.renderAt = async (t) => {
  const st = document.documentElement.style;
  st.setProperty('--dx', `${(t * 18) % 44}px`); st.setProperty('--dy', `${(t * 26) % 44}px`);
  const sq = plan.format === 'sq'; const W = 1080, H = sq ? 1080 : 1920;
  const b1 = document.getElementById('blob1'), r1 = document.getElementById('ring1'), r2 = document.getElementById('ring2');
  b1.style.left = `${W * 0.55 + Math.sin(t * 0.35) * 60}px`; b1.style.top = `${H * (sq ? 0.5 : 0.6) + Math.cos(t * 0.3) * 80}px`;
  r1.style.left = `${-W * 0.35 + Math.sin(t * 0.25) * 40}px`; r1.style.top = `${-H * (sq ? 0.25 : 0.12) + Math.cos(t * 0.2) * 50}px`;
  r1.style.transform = `scale(${1 + Math.sin(t * 0.5) * 0.04})`;
  r2.style.left = `${W * 0.72 + Math.cos(t * 0.45) * 30}px`; r2.style.top = `${H * (sq ? 0.08 : 0.16) + Math.sin(t * 0.4) * 30}px`;

  // 切り替えの帯
  let wx = 130, wx2 = 130;
  for (const s of plan.scenes) {
    if (s.start === 0) continue;
    const k = (t - (s.start - WIPE)) / (2 * WIPE);
    if (k >= 0 && k <= 1) wx = (1 - 2 * E.inout(k)) * 130;
    const k2 = (t - (s.start - WIPE - 0.06)) / (2 * WIPE);
    if (k2 >= 0 && k2 <= 1) wx2 = (1 - 2 * E.inout(k2)) * 130;
  }
  document.getElementById('wipe1').style.transform = `skewX(-14deg) translateX(${wx}%)`;
  document.getElementById('wipe2').style.transform = `skewX(-14deg) translateX(${wx2}%)`;

  document.querySelectorAll('.scene').forEach((el) => {
    const s = plan.scenes[+el.dataset.i];
    const last = s.end >= plan.duration;
    const on = t >= s.start && (t < s.end || last);
    el.style.display = on ? 'block' : 'none';
    if (!on) return;
    const lt = t - s.start;
    el.querySelectorAll('.a').forEach((a) => animate(a, lt, t));
  });
  return true;
};
</script>
</body>
</html>
