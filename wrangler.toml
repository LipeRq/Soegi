name = "soegi-demo"
main = "src/worker.js"
compatibility_date = "2026-10-01"

# 公開するとき、ダッシュボードで直接入れた変数（Variables）を消さない（wrangler.toml に無いものを残す）。
# 秘密の値（secret）は、もともと上書きされない。
keep_vars = true

# 静的ファイル（public/）＋ API（/api/*）
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*", "/line/*"]

[vars]
# deepseek（デモ）／ claude（本番：お客さんのデータを扱う導入では必ず claude）
AI_PROVIDER = "deepseek"
DEEPSEEK_TEXT_MODEL = "deepseek-v4-flash"
DEEPSEEK_VISION_MODEL = "deepseek-v4-flash-vision-exp"
CLAUDE_MODEL = "claude-sonnet-5-5"
# サイトのチャットボットを呼んでよいサイト（カンマ区切り）
CHAT_ALLOWED_ORIGINS = "https://withsoegi.jp,https://www.withsoegi.jp"
# Turnstile のサイトキー（公開してよい値）。空のあいだ、宿のデモの自由入力は使えない（例文は使える）
TURNSTILE_SITEKEY = ""

# 同じIPから1分に30リクエストまで
[[ratelimits]]
name = "LIMITER"
namespace_id = "1001"
  [ratelimits.simple]
  limit = 30
  period = 60

# 宿の自由入力（1日5回）とチャットボット（1日30回）の回数を数える KV。LINE で答えるときは必須（モードを24時間覚える・1日20回・通知の重複を捨てる）。
# 作り方：npx wrangler kv namespace create DEMO_KV → 表示された id を下に入れて、コメントを外す。
# 無くても動くが、そのときは回数を Worker のメモリで数えるだけになる（目安）。
# [[kv_namespaces]]
# binding = "DEMO_KV"
# id = "ここに id"

[[routes]]
pattern = "demo.withsoegi.jp"
custom_domain = true

# 画像・入力・結果は保存しない。ログにも本文を出さないため、observability は有効にしない。
# secret は次のコマンドで設定する：
#   wrangler secret put DEMO_PASSCODE
#   wrangler secret put DEEPSEEK_API_KEY
#   wrangler secret put ANTHROPIC_API_KEY   （claude に切り替えるときだけ）
#   wrangler secret put TURNSTILE_SECRET    （宿のデモの自由入力を使うときだけ）
#   wrangler secret put LINE_CHANNEL_SECRET        （LINE で答えるときだけ。docs/line-setup.md）
#   wrangler secret put LINE_CHANNEL_ACCESS_TOKEN  （同上）
#   wrangler secret put HASH_SALT           （任意。回数を数えるときのIPのハッシュに混ぜる値）
